<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Cat's Journey Lite — FE Civil and PE Civil study guide, flashcards, and graded practice exams in one offline file.">
<title>Cat's Journey Lite — FE &amp; PE Civil</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%235B8DEF'/><text y='72' x='50' text-anchor='middle' font-size='58'>🐱</text></svg>">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#0F1216;--bg2:#151A21;--surface:#1A2028;--surface2:#212933;--surface3:#2A343F;
  --line:#2C3742;--line2:#232C36;--text:#E8EDF3;--text2:#A6B2C0;--text3:#6F7D8C;
  --accent:#5B8DEF;--accent2:#8AB4F8;--good:#4CAF7D;--warn:#E0A458;--bad:#E06C75;
  --r:14px;--mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
html{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;max-width:100%}
h1,h2,h3{margin:0;letter-spacing:-.02em;line-height:1.25}
h1{font-size:24px}h2{font-size:19px}h3{font-size:16px}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
::selection{background:rgba(91,141,239,.35)}

.wrap{max-width:900px;margin:0 auto;padding:0 20px}

header{
  position:sticky;top:0;z-index:50;background:rgba(15,18,22,.88);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line2);
}
.hrow{display:flex;align-items:center;gap:14px;padding:13px 0;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em;min-width:0}
.logo span.mark{width:32px;height:32px;flex:0 0 32px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--accent),var(--accent2));font-size:17px}
.logo small{display:block;font-size:10.5px;color:var(--text3);font-weight:500;letter-spacing:0}
.sel{
  margin-left:auto;padding:8px 12px;border-radius:10px;background:var(--surface2);
  border:1px solid var(--line);color:var(--text);font-size:13.5px;font-weight:600;
  max-width:100%;appearance:none;cursor:pointer;
}
.tabs{display:flex;gap:4px;padding:4px;background:var(--surface2);border-radius:11px;margin:0 0 22px;overflow-x:auto}
.tab{padding:8px 15px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--text3);white-space:nowrap;transition:.15s}
.tab:hover{color:var(--text)}
.tab.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.2)}

main{padding:22px 0 60px}
.view{animation:in .3s cubic-bezier(.22,.61,.36,1)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.card{background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);padding:18px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;
  font-weight:600;background:var(--surface2);color:var(--text2);border:1px solid var(--line2)}
.chip.a{background:rgba(91,141,239,.16);color:var(--accent2);border-color:transparent}
.chip.g{background:rgba(76,175,125,.16);color:var(--good);border-color:transparent}
.chip.w{background:rgba(224,164,88,.16);color:var(--warn);border-color:transparent}
.chip.b{background:rgba(224,108,117,.16);color:var(--bad);border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:10px;
  font-weight:600;font-size:13.5px;background:var(--surface2);border:1px solid var(--line);transition:.15s}
.btn:hover{background:var(--surface3);transform:translateY(-1px)}
.btn.p{background:linear-gradient(140deg,var(--accent),#3f6dc4);border-color:transparent;color:#fff}
.btn.d{color:var(--bad);border-color:rgba(224,108,117,.3)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.sm{padding:6px 12px;font-size:12.5px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;min-width:0}
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.muted{color:var(--text3);font-size:12.5px}
.mt{margin-top:22px}

/* intro */
.intro{border-radius:18px;padding:24px;margin-bottom:22px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,rgba(91,141,239,.18),var(--surface) 62%);border:1px solid var(--line2)}
.intro h1{margin-bottom:7px}
.intro p{color:var(--text2);font-size:13.5px;max-width:62ch}
.facts{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}

/* accordion */
.acc{background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);margin-bottom:9px;overflow:hidden}
.acc-h{display:flex;align-items:center;gap:13px;width:100%;padding:14px 16px;text-align:left}
.acc-n{width:26px;height:26px;flex:0 0 26px;border-radius:8px;background:var(--surface2);
  display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--text2)}
.acc-t{flex:1;min-width:0}
.acc-t b{font-size:14.5px;font-weight:620;display:block}
.acc-body{display:none;padding:0 16px 16px;border-top:1px solid var(--line2);margin-top:2px;padding-top:14px}
.acc.on .acc-body{display:block}
.acc .caret{transition:transform .25s;color:var(--text3)}
.acc.on .caret{transform:rotate(180deg)}
.subs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.sub{font-size:12px;padding:5px 10px;border-radius:8px;background:var(--bg2);border:1px solid var(--line2);color:var(--text2)}

/* flashcard */
.fcwrap{display:flex;flex-direction:column;align-items:center;gap:18px}
.fc{width:100%;max-width:620px;height:320px;perspective:1500px;cursor:pointer}
.fci{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.22,.61,.36,1);transform-style:preserve-3d}
.fc.flip .fci{transform:rotateY(180deg)}
.fcf{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;border:1px solid var(--line);
  background:var(--surface);padding:28px;display:flex;flex-direction:column;box-shadow:0 8px 28px rgba(0,0,0,.28)}
.fcb{transform:rotateY(180deg);background:var(--surface2)}
.fct{font-size:10.5px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
.fcx{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:19px;font-weight:600;line-height:1.5}
.fcb .fcx{font-family:var(--mono);font-size:14px;font-weight:500;white-space:pre-wrap;text-align:left;
  line-height:1.85;justify-content:flex-start;overflow-y:auto}
.hint{font-size:11.5px;color:var(--text3);text-align:center}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.bar{height:6px;background:var(--surface3);border-radius:20px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:20px;transition:width .5s}
.timer{font-family:var(--mono);font-weight:600;padding:6px 11px;border-radius:9px;
  background:var(--surface2);border:1px solid var(--line2);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad);border-color:rgba(224,108,117,.4)}
.qtopic{font-size:10.5px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.stem{font-size:16px;line-height:1.65;font-weight:500;margin-bottom:18px;white-space:pre-wrap}
.ch{display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border-radius:10px;background:var(--bg2);
  border:1.5px solid var(--line2);text-align:left;width:100%;margin-bottom:9px;transition:.15s;font-size:14.5px}
.ch:hover:not(.lock){border-color:var(--accent);background:var(--surface2)}
.ck{width:23px;height:23px;flex:0 0 23px;border-radius:7px;background:var(--surface3);display:grid;
  place-items:center;font-size:11.5px;font-weight:700;color:var(--text2)}
.ch.sel{border-color:var(--accent);background:rgba(91,141,239,.1)}
.ch.sel .ck{background:var(--accent);color:#fff}
.ch.ok{border-color:var(--good);background:rgba(76,175,125,.12)}
.ch.ok .ck{background:var(--good);color:#fff}
.ch.no{border-color:var(--bad);background:rgba(224,108,117,.12)}
.ch.no .ck{background:var(--bad);color:#fff}
.ch.lock{cursor:default}
.exp{margin-top:16px;padding:15px 17px;border-radius:10px;background:var(--bg2);border-left:3px solid var(--accent)}
.exp b{display:block;font-size:12.5px;margin-bottom:8px}
.exp pre{margin:0;font-family:var(--mono);font-size:12.5px;line-height:1.8;white-space:pre-wrap;color:var(--text2)}
.eqn{margin-top:10px;padding:8px 11px;border-radius:8px;background:var(--surface2);
  font-family:var(--mono);font-size:12.5px;color:var(--accent2)}
.pal{display:flex;flex-wrap:wrap;gap:6px;padding:13px;background:var(--surface);
  border:1px solid var(--line2);border-radius:var(--r);margin-bottom:14px}
.pal button{width:30px;height:30px;border-radius:8px;background:var(--bg2);border:1px solid var(--line2);
  font-size:11.5px;font-weight:650;color:var(--text3);transition:.13s}
.pal button.a{background:rgba(91,141,239,.22);color:var(--accent2);border-color:transparent}
.pal button.cur{border-color:var(--accent);border-width:2px;color:var(--text)}

/* results */
.res{text-align:center;padding:32px 20px;background:var(--surface);border:1px solid var(--line2);
  border-radius:18px;margin-bottom:18px}
.score{font-size:52px;font-weight:780;letter-spacing:-.04em;line-height:1}
.rev{background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);padding:17px;margin-bottom:10px}
.badge{width:24px;height:24px;flex:0 0 24px;border-radius:7px;display:grid;place-items:center;
  color:#fff;font-size:12px;font-weight:700}

/* formulas */
.fgrp{margin-bottom:20px}
.fgrp>b{display:block;font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--accent);margin-bottom:10px}
.fitem{display:flex;gap:16px;padding:11px 14px;background:var(--surface);border:1px solid var(--line2);
  border-radius:10px;margin-bottom:6px;align-items:center}
.fitem .n{flex:0 0 200px;font-size:13.5px;font-weight:580}
.fitem .e{flex:1;font-family:var(--mono);font-size:12.5px;color:var(--accent2);word-break:break-word}
.search{width:100%;padding:10px 13px;background:var(--bg2);border:1px solid var(--line);
  border-radius:10px;color:var(--text);font-size:13.5px;margin-bottom:16px}
.search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,141,239,.18)}

.empty{text-align:center;padding:50px 20px;color:var(--text3)}
.empty h3{color:var(--text);margin-bottom:6px}

footer{border-top:1px solid var(--line2);padding:22px 0 34px;color:var(--text3);font-size:12px;line-height:1.7}

@media(max-width:680px){
  h1{font-size:20px}
  .g2,.g3{grid-template-columns:1fr}
  .fitem{flex-direction:column;align-items:flex-start;gap:5px}
  .fitem .n{flex:0 0 auto}
  .fc{height:290px}.fcf{padding:20px}.fcx{font-size:17px}
  .sel{margin-left:0;width:100%}
  .score{font-size:42px}
}
@media print{header,.tabs,.btn,footer{display:none!important}}
</style>

/* ---------------- Ethics ---------------- */
{ id:'fe-eth-1', track:'fe-civil', topic:'fe-ethics', diff:1,
  stem:'Under the NCEES Model Rules, an engineer\u2019s FIRST obligation is to:',
  choices:['The client who pays the fee','The employer\u2019s profitability','The safety, health, and welfare of the public','The engineering profession\u2019s reputation'], answer:2,
  solution:'The paramount canon in essentially every engineering code of ethics is that licensees "shall hold paramount the safety, health, and welfare of the public." Client, employer, and profession obligations are real but subordinate to public welfare.' },
{ id:'fe-eth-2', track:'fe-civil', topic:'fe-ethics', diff:2,
  stem:'A structural engineer is asked to seal drawings for a mechanical HVAC system she did not prepare and has no training in. She should:',
  choices:['Seal them, since she is a licensed PE','Seal them if the mechanical designer signs a waiver','Decline \u2014 engineers may only seal work in their area of competence','Seal them but add a disclaimer note'], answer:2,
  solution:'Model Rules limit practice to areas of competence and prohibit sealing work not prepared under the licensee\u2019s responsible charge. Neither a waiver nor a disclaimer cures either violation.' },
{ id:'fe-eth-3', track:'fe-civil', topic:'fe-ethics', diff:2,
  stem:'An engineer discovers that a contractor is substituting a lower-grade steel than specified, creating a potential safety hazard. The owner tells him to keep quiet. He should:',
  choices:['Follow the owner\u2019s instruction \u2014 the owner accepts the risk','Notify the appropriate authority after informing the owner of the danger','Resign quietly from the project','Document it privately and take no further action'], answer:1,
  solution:'When public safety is endangered, the engineer must notify the employer/client first and, if the situation is not corrected, notify the proper authority. Silence, quiet resignation, or private documentation all leave the public exposed.' },
{ id:'fe-eth-4', track:'fe-civil', topic:'fe-ethics', diff:1,
  stem:'Which of the following is generally permitted under engineering codes of ethics?',
  choices:['Accepting a substantial gift from a supplier whose product you specify','Accepting a commission from a contractor you recommended','Accepting reasonable compensation from more than one party on a project when all parties consent in writing','Paying a finder\u2019s fee to secure a public contract'], answer:2,
  solution:'Multiple compensation is permitted only with full disclosure and the consent of all interested parties. Substantial supplier gifts, contractor commissions, and contingent finder\u2019s fees for public work are all prohibited conflicts.' },
{ id:'fe-eth-5', track:'fe-civil', topic:'fe-ethics', diff:2,
  stem:'"Responsible charge" most nearly means:',
  choices:['Being the highest-paid engineer on the project','Direct control and personal supervision of the engineering work','Having signed the contract with the client','Being an officer of the engineering firm'], answer:1,
  solution:'Responsible charge means direct control and personal supervision of the work. It is the requirement that permits a licensee to seal a document, and it cannot be delegated to someone outside the licensee\u2019s supervision.' },
{ id:'fe-eth-6', track:'fe-civil', topic:'fe-ethics', diff:2,
  stem:'An EIT works full-time for Firm A and does small private design jobs on weekends without telling Firm A. This is:',
  choices:['Acceptable \u2014 personal time is personal','A conflict of interest that must be disclosed to the employer','Illegal in all U.S. jurisdictions','Acceptable only if the jobs are unpaid'], answer:1,
  solution:'Outside employment that could compete with or affect the employer\u2019s interests is a conflict requiring disclosure and typically the employer\u2019s consent. It is not automatically illegal, but concealment is the ethics violation.' },
{ id:'fe-eth-7', track:'fe-civil', topic:'fe-ethics', diff:1,
  stem:'Engineering licensure in the United States is granted by:',
  choices:['NCEES','ABET','The individual state or territorial licensing board','NSPE'], answer:2,
  solution:'NCEES develops and scores the exams; ABET accredits degree programs; NSPE is a professional society. Only the individual state (or territorial) board issues a license.' },
{ id:'fe-eth-8', track:'fe-civil', topic:'fe-ethics', diff:2,
  stem:'An engineer\u2019s public statement on a technical matter should:',
  choices:['Support whichever position the paying client prefers','Be issued only when the engineer is qualified and must disclose any interested party paying for it','Never be issued without board approval','Be anonymous to avoid liability'], answer:1,
  solution:'Codes require public statements to be objective and truthful, made only in areas of competence, and to identify the interested party on whose behalf the engineer speaks when compensation is involved.' },

{ id:'fe-econ-1', track:'fe-civil', topic:'fe-econ', diff:1,

{ id:'fe-econ-2', track:'fe-civil', topic:'fe-econ', diff:2,

{ id:'fe-econ-3', track:'fe-civil', topic:'fe-econ', diff:2,

{ id:'fe-econ-4', track:'fe-civil', topic:'fe-econ', diff:1,

{ id:'fe-econ-5', track:'fe-civil', topic:'fe-econ', diff:2,

{ id:'fe-econ-6', track:'fe-civil', topic:'fe-econ', diff:2,

{ id:'fe-econ-7', track:'fe-civil', topic:'fe-econ', diff:2,

{ id:'fe-econ-8', track:'fe-civil', topic:'fe-econ', diff:3,

{ id:'fe-stat-1', track:'fe-civil', topic:'fe-statics', diff:2,

  stem:'At a truss support joint, a 12-kip upward reaction is resisted by one horizontal member and one diagonal at 45\u00B0. What is the force in the diagonal?',

  solution:'\u03A3F_y = 0 at the joint: F_diag \u00B7 sin45\u00B0 = 12\nF_diag = 12/0.7071 = 16.97 \u2248 17.0 kip (compression).',
  formula:'\u03A3F_y = 0 at joint' },
{ id:'fe-stat-8', track:'fe-civil', topic:'fe-statics', diff:2,
  stem:'A cantilever beam 12 ft long carries a uniform load of 3 kip/ft. What is the fixed-end moment magnitude?',
  choices:['108 kip-ft','144 kip-ft','216 kip-ft','432 kip-ft'], answer:2,
  solution:'M = wL\u00B2/2 = 3(12)\u00B2/2 = 3(144)/2 = 216 kip-ft.',
  formula:'M_fixed = wL\u00B2/2' },

/* ---------------- Dynamics ---------------- */
{ id:'fe-dyn-1', track:'fe-civil', topic:'fe-dynamics', diff:2,
  stem:'A projectile is launched at 30 m/s at 40\u00B0 above horizontal. What is the maximum height reached? (g = 9.81 m/s\u00B2)',

  solution:'v_y0 = 30 sin40\u00B0 = 19.28 m/s\nh = v_y0\u00B2/(2g) = (19.28)\u00B2/(2\u00D79.81) = 371.9/19.62 = 18.95 m.',
  formula:'h = v\u2080y\u00B2/(2g)' },
{ id:'fe-dyn-2', track:'fe-civil', topic:'fe-dynamics', diff:1,
  stem:'A car traveling 25 m/s stops in 60 m. What is the constant deceleration?',
  choices:['\u22123.47 m/s\u00B2','\u22124.17 m/s\u00B2','\u22125.21 m/s\u00B2','\u22126.25 m/s\u00B2'], answer:2,
  solution:'v\u00B2 = v\u2080\u00B2 + 2as \u2192 0 = 625 + 2a(60)\na = \u2212625/120 = \u22125.21 m/s\u00B2.',
  formula:'v\u00B2 = v\u2080\u00B2 + 2as' },
{ id:'fe-dyn-3', track:'fe-civil', topic:'fe-dynamics', diff:1,
  stem:'What is the kinetic energy of a 1,500-kg car traveling at 20 m/s?',
  choices:['150 kJ','300 kJ','450 kJ','600 kJ'], answer:1,
  solution:'KE = \u00BDmv\u00B2 = 0.5(1500)(20)\u00B2 = 0.5(1500)(400) = 300,000 J = 300 kJ.',
  formula:'KE = \u00BDmv\u00B2' },
{ id:'fe-dyn-4', track:'fe-civil', topic:'fe-dynamics', diff:2,
  stem:'A vehicle travels a curve of 100-m radius at 20 m/s. What is the normal (centripetal) acceleration?',
  choices:['0.2 m/s\u00B2','2.0 m/s\u00B2','4.0 m/s\u00B2','20 m/s\u00B2'], answer:2,
  solution:'a_n = v\u00B2/r = (20)\u00B2/100 = 400/100 = 4.0 m/s\u00B2.',
  formula:'a\u2099 = v\u00B2/r' },
{ id:'fe-dyn-5', track:'fe-civil', topic:'fe-dynamics', diff:2,
  stem:'A solid disk of mass 10 kg and radius 0.5 m rotates about its center. What is its mass moment of inertia?',
  choices:['1.25 kg\u00B7m\u00B2','2.50 kg\u00B7m\u00B2','5.00 kg\u00B7m\u00B2','10.0 kg\u00B7m\u00B2'], answer:0,
  solution:'I = \u00BDmr\u00B2 = 0.5(10)(0.5)\u00B2 = 0.5(10)(0.25) = 1.25 kg\u00B7m\u00B2.',
  formula:'I_disk = \u00BDmr\u00B2' },
{ id:'fe-dyn-6', track:'fe-civil', topic:'fe-dynamics', diff:2,
  stem:'A 50-kg crate on a frictionless 30\u00B0 incline is released. What is its acceleration down the slope?',
  choices:['2.45 m/s\u00B2','4.91 m/s\u00B2','8.50 m/s\u00B2','9.81 m/s\u00B2'], answer:1,
  solution:'a = g sin\u03B8 = 9.81 sin30\u00B0 = 9.81(0.5) = 4.91 m/s\u00B2.\nMass does not affect the result on a frictionless incline.',
  formula:'a = g sin\u03B8' },

/* ---------------- Mechanics of Materials ---------------- */
{ id:'fe-mom-1', track:'fe-civil', topic:'fe-mechmat', diff:2,
  stem:'A steel rod (A = 2 in\u00B2, L = 10 ft, E = 29,000 ksi) carries a 50-kip tensile load. What is the elongation?',
  choices:['0.052 in','0.103 in','0.207 in','0.310 in'], answer:1,
  solution:'\u03B4 = PL/(AE) = 50(120)/(2 \u00D7 29,000)\n= 6,000/58,000 = 0.103 in.',
  formula:'\u03B4 = PL/AE' },
{ id:'fe-mom-2', track:'fe-civil', topic:'fe-mechmat', diff:2,
  stem:'A rectangular beam 8 in wide \u00D7 16 in deep resists a moment of 150 kip-ft. What is the maximum bending stress?',
  choices:['4.12 ksi','5.27 ksi','6.84 ksi','8.79 ksi'], answer:1,
  solution:'S = bh\u00B2/6 = 8(16)\u00B2/6 = 2048/6 = 341.3 in\u00B3\nM = 150 kip-ft = 1,800 kip-in\n\u03C3 = M/S = 1,800/341.3 = 5.27 ksi.',
  formula:'\u03C3 = M/S = Mc/I' },
{ id:'fe-mom-3', track:'fe-civil', topic:'fe-mechmat', diff:2,
  stem:'The same 8 in \u00D7 16 in rectangular beam carries a shear of 40 kip. What is the maximum shear stress?',
  choices:['0.313 ksi','0.469 ksi','0.625 ksi','0.938 ksi'], answer:1,
  solution:'For a rectangle, \u03C4_max = 1.5V/A\nA = 8(16) = 128 in\u00B2\n\u03C4 = 1.5(40)/128 = 60/128 = 0.469 ksi.',
  formula:'\u03C4_max = 3V/(2A) for rectangles' },
{ id:'fe-mom-4', track:'fe-civil', topic:'fe-mechmat', diff:3,
  stem:'A pinned-pinned steel column has I = 100 in\u2074, L = 20 ft, E = 29,000 ksi. What is the Euler buckling load?',
  choices:['248 kip','372 kip','497 kip','745 kip'], answer:2,
  solution:'P_cr = \u03C0\u00B2EI/(KL)\u00B2 with K = 1.0\nKL = 240 in\nP_cr = \u03C0\u00B2(29,000)(100)/(240)\u00B2\n= 28,621,000/57,600 = 497 kip.',
  formula:'P_cr = \u03C0\u00B2EI/(KL)\u00B2' },
{ id:'fe-mom-5', track:'fe-civil', topic:'fe-mechmat', diff:3,
  stem:'A plane stress element has \u03C3\u2093 = 80 ksi, \u03C3_y = 20 ksi, \u03C4\u2093_y = 30 ksi. What is the maximum principal stress?',
  choices:['80.0 ksi','86.5 ksi','92.4 ksi','100.0 ksi'], answer:2,
  solution:'Center = (\u03C3\u2093 + \u03C3_y)/2 = 50 ksi\nR = \u221A[((\u03C3\u2093\u2212\u03C3_y)/2)\u00B2 + \u03C4\u00B2] = \u221A(30\u00B2 + 30\u00B2) = 42.43 ksi\n\u03C3\u2081 = 50 + 42.43 = 92.4 ksi.',
  formula:'\u03C3\u2081,\u2082 = (\u03C3\u2093+\u03C3_y)/2 \u00B1 R' },
{ id:'fe-mom-6', track:'fe-civil', topic:'fe-mechmat', diff:2,
  stem:'A fully restrained steel member experiences a 60\u00B0F temperature rise. With \u03B1 = 6.5\u00D710\u207B\u2076/\u00B0F and E = 29,000 ksi, what is the thermal stress?',
  choices:['5.66 ksi','11.31 ksi','18.85 ksi','22.62 ksi'], answer:1,
  solution:'\u03C3 = E\u03B1\u0394T = 29,000(6.5\u00D710\u207B\u2076)(60)\n= 29,000(3.9\u00D710\u207B\u2074) = 11.31 ksi (compression).',
  formula:'\u03C3_thermal = E\u03B1\u0394T' },
{ id:'fe-mom-7', track:'fe-civil', topic:'fe-mechmat', diff:2,
  stem:'A steel bar with \u03BD = 0.30 is stretched to an axial strain of 0.002. What is the transverse strain?',
  choices:['\u22120.0006','\u22120.0020','+0.0006','+0.0060'], answer:0,
  solution:'\u03B5_lateral = \u2212\u03BD\u03B5_axial = \u22120.30(0.002) = \u22120.0006 (contraction).',
  formula:'\u03BD = \u2212\u03B5_lat/\u03B5_axial' },

/* ---------------- Materials ---------------- */
{ id:'fe-mat-1', track:'fe-civil', topic:'fe-materials', diff:1,
  stem:'For a given set of materials, decreasing the water-cement ratio of concrete generally:',
  choices:['Increases strength and decreases workability','Decreases strength and increases workability','Increases both strength and workability','Has no effect on strength'], answer:0,
  solution:'Abrams\u2019 law: compressive strength is inversely related to w/c ratio. Lower w/c means higher strength and lower permeability, but a stiffer, less workable mix (often offset with water-reducing admixtures).' },
{ id:'fe-mat-2', track:'fe-civil', topic:'fe-materials', diff:2,
  stem:'A concrete cylinder 6 in diameter fails at 113,000 lb. What is f\u2032c?',
  choices:['3,000 psi','3,500 psi','4,000 psi','4,500 psi'], answer:2,
  solution:'A = \u03C0(6)\u00B2/4 = 28.27 in\u00B2\nf\u2032c = 113,000/28.27 = 3,997 \u2248 4,000 psi.',
  formula:'f\u2032c = P/A' },
{ id:'fe-mat-3', track:'fe-civil', topic:'fe-materials', diff:2,
  stem:'The modulus of elasticity of normalweight concrete with f\u2032c = 4,000 psi is most nearly:',
  choices:['2,400 ksi','3,600 ksi','4,500 ksi','5,700 ksi'], answer:1,
  solution:'E_c = 57,000\u221Af\u2032c (psi) = 57,000\u221A4,000\n= 57,000(63.25) = 3,605,000 psi \u2248 3,600 ksi.',
  formula:'E_c = 57,000\u221Af\u2032c (psi)' },
{ id:'fe-mat-4', track:'fe-civil', topic:'fe-materials', diff:1,
  stem:'ASTM A992 structural steel has a specified minimum yield stress of:',
  choices:['36 ksi','42 ksi','50 ksi','60 ksi'], answer:2,
  solution:'A992 (the standard grade for wide-flange shapes) has F_y = 50 ksi and F_u = 65 ksi. A36 is the 36-ksi grade; 60 ksi is typical reinforcing bar (A615 Gr. 60).' },
{ id:'fe-mat-5', track:'fe-civil', topic:'fe-materials', diff:2,
  stem:'In the Marshall mix design method for asphalt concrete, "VMA" refers to:',
  choices:['Voids in mineral aggregate','Volume of measured asphalt','Viscosity modified asphalt','Void modulus of aggregate'], answer:0,
  solution:'VMA = voids in the mineral aggregate, the intergranular void space between aggregate particles including air voids and effective binder. Adequate VMA ensures enough room for durable binder film thickness.' },
{ id:'fe-mat-6', track:'fe-civil', topic:'fe-materials', diff:2,
  stem:'A soil/aggregate sample has 62% passing the No. 200 sieve. This material is best described as:',
  choices:['Coarse-grained','Fine-grained','Well-graded gravel','Clean sand'], answer:1,
  solution:'The USCS boundary is 50% passing the No. 200 sieve. More than 50% passing means the material is fine-grained (silt or clay), so 62% passing is fine-grained.' },

{ id:'fe-fl-1', track:'fe-civil', topic:'fe-fluids', diff:1,
  stem:'What is the gage pressure 10 m below the surface of fresh water?',
  choices:['9.81 kPa','49.1 kPa','98.1 kPa','981 kPa'], answer:2,

{ id:'fe-fl-2', track:'fe-civil', topic:'fe-fluids', diff:2,
  stem:'Water flows at 2 cfs through an 8-in diameter pipe. What is the average velocity?',
  choices:['3.82 fps','5.73 fps','7.16 fps','9.55 fps'], answer:1,
  solution:'D = 8 in = 0.667 ft\nA = \u03C0D\u00B2/4 = \u03C0(0.4444)/4 = 0.349 ft\u00B2\nV = Q/A = 2/0.349 = 5.73 fps.',

{ id:'fe-fl-3', track:'fe-civil', topic:'fe-fluids', diff:2,
  stem:'Water (\u03BD = 1\u00D710\u207B\u2076 m\u00B2/s) flows at 2 m/s in a 0.1-m pipe. The Reynolds number and flow regime are:',
  choices:['2,000 \u2014 laminar','20,000 \u2014 transitional','200,000 \u2014 turbulent','2,000,000 \u2014 turbulent'], answer:2,
  solution:'Re = VD/\u03BD = 2(0.1)/1\u00D710\u207B\u2076 = 200,000.\nRe > 4,000 \u2192 fully turbulent.',

{ id:'fe-fl-4', track:'fe-civil', topic:'fe-fluids', diff:2,
  stem:'Using Darcy-Weisbach with f = 0.02, L = 1,000 ft, D = 1 ft, V = 5 fps, what is the friction head loss?',
  choices:['3.88 ft','7.76 ft','12.4 ft','15.5 ft'], answer:1,
  solution:'h_f = f(L/D)(V\u00B2/2g)\n= 0.02(1,000/1)(25/64.4)\n= 20(0.3882) = 7.76 ft.',
  formula:'h_f = f(L/D)(V\u00B2/2g)' },
{ id:'fe-fl-5', track:'fe-civil', topic:'fe-fluids', diff:2,
  stem:'A vertical rectangular gate 4 ft wide extends from the water surface to 8 ft deep. What is the resultant hydrostatic force?',
  choices:['3,994 lb','7,987 lb','15,974 lb','19,968 lb'], answer:1,
  solution:'h\u0304 = 8/2 = 4 ft, A = 4(8) = 32 ft\u00B2\nF = \u03B3h\u0304A = 62.4(4)(32) = 7,987 lb.',
  formula:'F = \u03B3h\u0304A' },
{ id:'fe-fl-6', track:'fe-civil', topic:'fe-fluids', diff:2,
  stem:'A block of volume 2 ft\u00B3 is fully submerged in fresh water. What is the buoyant force?',
  choices:['31.2 lb','62.4 lb','124.8 lb','187.2 lb'], answer:2,
  solution:'F_b = \u03B3V_displaced = 62.4(2) = 124.8 lb.',
  formula:'F_b = \u03B3V' },
{ id:'fe-fl-7', track:'fe-civil', topic:'fe-fluids', diff:2,
  stem:'Water exits a nozzle at 30 fps. What is the velocity head?',

{ id:'fe-sur-1', track:'fe-civil', topic:'fe-survey', diff:2,
  stem:'A horizontal curve has R = 1,000 ft and \u0394 = 30\u00B0. What is the curve length L?',
  choices:['261.8 ft','392.7 ft','523.6 ft','628.3 ft'], answer:2,
  solution:'L = R\u0394(\u03C0/180) = 1,000(30)(0.017453) = 523.6 ft.',
  formula:'L = R\u0394\u03C0/180' },
{ id:'fe-sur-2', track:'fe-civil', topic:'fe-survey', diff:2,
  stem:'For the same curve (R = 1,000 ft, \u0394 = 30\u00B0), what is the tangent distance T?',
  choices:['133.9 ft','267.9 ft','500.0 ft','577.4 ft'], answer:1,
  solution:'T = R tan(\u0394/2) = 1,000 tan(15\u00B0) = 1,000(0.26795) = 267.9 ft.',

{ id:'fe-sur-3', track:'fe-civil', topic:'fe-survey', diff:2,
  stem:'Two cross sections 100 ft apart have end areas of 250 ft\u00B2 and 310 ft\u00B2. Using the average end area method, what is the volume in cubic yards?',
  choices:['926 cy','1,037 cy','1,148 cy','2,074 cy'], answer:1,
  solution:'V = L(A\u2081 + A\u2082)/2 = 100(250 + 310)/2 = 28,000 ft\u00B3\n28,000/27 = 1,037 cy.',
  formula:'V = L(A\u2081+A\u2082)/2' },
{ id:'fe-sur-4', track:'fe-civil', topic:'fe-survey', diff:1,
  stem:'A benchmark at elevation 452.30 ft is sighted with a backsight of 5.42 ft. A foresight of 8.16 ft is then taken on a turning point. What is the turning point elevation?',
  choices:['449.56 ft','452.30 ft','455.04 ft','465.88 ft'], answer:0,
  solution:'HI = 452.30 + 5.42 = 457.72 ft\nElev_TP = HI \u2212 FS = 457.72 \u2212 8.16 = 449.56 ft.',
  formula:'HI = Elev + BS ; Elev = HI \u2212 FS' },
{ id:'fe-sur-5', track:'fe-civil', topic:'fe-survey', diff:2,
  stem:'A line has an azimuth of 235\u00B0 measured from north. What is its bearing?',
  choices:['N 55\u00B0 E','S 55\u00B0 E','S 55\u00B0 W','N 55\u00B0 W'], answer:2,
  solution:'235\u00B0 falls in the third quadrant (180\u00B0\u2013270\u00B0).\nBearing angle = 235\u00B0 \u2212 180\u00B0 = 55\u00B0 \u2192 S 55\u00B0 W.',
  formula:'3rd quadrant: bearing = azimuth \u2212 180\u00B0' },
{ id:'fe-sur-6', track:'fe-civil', topic:'fe-survey', diff:2,
  stem:'A course is 500.00 ft long with a bearing of N 30\u00B0 E. What is its departure?',

/* ---------------- Water Resources & Environmental ---------------- */
{ id:'fe-wr-1', track:'fe-civil', topic:'fe-water', diff:1,
  stem:'Using the rational method with C = 0.60, i = 2.5 in/hr, and A = 10 acres, what is the peak discharge?',
  choices:['4.2 cfs','15.0 cfs','25.0 cfs','41.7 cfs'], answer:1,
  solution:'Q = CiA = 0.60(2.5)(10) = 15.0 cfs.\n(In these units the conversion factor is conveniently 1.0.)',
  formula:'Q = CiA' },
{ id:'fe-wr-2', track:'fe-civil', topic:'fe-water', diff:3,
  stem:'A rectangular channel 6 ft wide flows 3 ft deep with n = 0.013 and S = 0.002. What is the discharge?',
  choices:['84 cfs','106 cfs','121 cfs','145 cfs'], answer:2,
  solution:'A = 6(3) = 18 ft\u00B2, P = 6 + 2(3) = 12 ft, R = 1.5 ft\nV = (1.486/n)R^(2/3)S^(1/2)\n= (1.486/0.013)(1.5)^0.667(0.002)^0.5\n= 114.3(1.311)(0.0447) = 6.70 fps\nQ = AV = 18(6.70) = 121 cfs.',
  formula:'Q = (1.486/n)AR^(2/3)S^(1/2)' },
{ id:'fe-wr-3', track:'fe-civil', topic:'fe-water', diff:2,
  stem:'A pump delivers 5 cfs against 100 ft of head at 80% efficiency. What is the required brake horsepower?',
  choices:['45.4 hp','56.7 hp','70.9 hp','88.6 hp'], answer:2,
  solution:'P = \u03B3Qh/(550\u03B7) = 62.4(5)(100)/(550 \u00D7 0.80)\n= 31,200/440 = 70.9 hp.',
  formula:'BHP = \u03B3Qh/(550\u03B7)' },
{ id:'fe-wr-4', track:'fe-civil', topic:'fe-water', diff:2,
  stem:'A chlorine demand of 2.4 mg/L must leave a 0.6 mg/L residual. What dose is required?',
  choices:['0.6 mg/L','1.8 mg/L','2.4 mg/L','3.0 mg/L'], answer:3,
  solution:'Dose = demand + residual = 2.4 + 0.6 = 3.0 mg/L.',
  formula:'Dose = Demand + Residual' },
{ id:'fe-wr-5', track:'fe-civil', topic:'fe-water', diff:3,
  stem:'A 10-mL sample is diluted to 300 mL. Initial DO is 8.8 mg/L, final DO after 5 days is 3.2 mg/L. What is BOD\u2085?',
  choices:['56 mg/L','112 mg/L','168 mg/L','224 mg/L'], answer:2,
  solution:'Dilution factor P = 10/300 = 0.0333\nBOD\u2085 = (DO\u1D62 \u2212 DO_f)/P = (8.8 \u2212 3.2)/0.0333\n= 5.6/0.0333 = 168 mg/L.',
  formula:'BOD\u2085 = (DO\u1D62 \u2212 DO_f)/P' },
{ id:'fe-wr-6', track:'fe-civil', topic:'fe-water', diff:2,
  stem:'A sedimentation basin treats 2 MGD and has a surface area of 2,000 ft\u00B2. What is the overflow rate?',
  choices:['500 gpd/ft\u00B2','1,000 gpd/ft\u00B2','1,500 gpd/ft\u00B2','2,000 gpd/ft\u00B2'], answer:1,
  solution:'v\u2080 = Q/A_s = 2,000,000 gpd / 2,000 ft\u00B2 = 1,000 gpd/ft\u00B2.',
  formula:'v\u2080 = Q/A_surface' },
{ id:'fe-wr-7', track:'fe-civil', topic:'fe-water', diff:2,
  stem:'A confined aquifer has k = 30 ft/day, a gradient of 0.004, and a cross-sectional area of 5,000 ft\u00B2. What is the flow rate?',
  choices:['60 ft\u00B3/day','300 ft\u00B3/day','600 ft\u00B3/day','1,200 ft\u00B3/day'], answer:2,
  solution:'Q = kiA = 30(0.004)(5,000) = 600 ft\u00B3/day.',
  formula:'Q = kiA (Darcy\u2019s law)' },

/* ---------------- Structural ---------------- */
{ id:'fe-str-1', track:'fe-civil', topic:'fe-structural', diff:1,
  stem:'A beam carries D = 1.5 kip/ft and L = 2.0 kip/ft. What is the LRFD factored load using 1.2D + 1.6L?',

  solution:'w_u = 1.2(1.5) + 1.6(2.0) = 1.8 + 3.2 = 5.0 kip/ft.',
  formula:'w_u = 1.2D + 1.6L' },
{ id:'fe-str-2', track:'fe-civil', topic:'fe-structural', diff:3,
  stem:'A singly reinforced beam has b = 12 in, d = 20 in, A\u209B = 3.0 in\u00B2, f\u2032c = 4 ksi, f_y = 60 ksi. What is \u03D5M\u2099 (tension-controlled)?',
  choices:['180 kip-ft','215 kip-ft','240 kip-ft','270 kip-ft'], answer:2,
  solution:'a = A\u209Bf_y/(0.85f\u2032c b) = 3.0(60)/(0.85 \u00D7 4 \u00D7 12) = 180/40.8 = 4.41 in\nM\u2099 = A\u209Bf_y(d \u2212 a/2) = 3.0(60)(20 \u2212 2.21) = 180(17.79) = 3,203 kip-in\n\u03D5M\u2099 = 0.9(3,203) = 2,883 kip-in = 240 kip-ft.',
  formula:'\u03D5M\u2099 = \u03D5A\u209Bf_y(d \u2212 a/2)' },
{ id:'fe-str-3', track:'fe-civil', topic:'fe-structural', diff:2,
  stem:'A simply supported beam spans 30 ft with a uniform load of 4 kip/ft. What is the maximum moment?',
  choices:['300 kip-ft','450 kip-ft','600 kip-ft','900 kip-ft'], answer:1,
  solution:'M_max = wL\u00B2/8 = 4(30)\u00B2/8 = 4(900)/8 = 450 kip-ft.',
  formula:'M = wL\u00B2/8' },
{ id:'fe-str-4', track:'fe-civil', topic:'fe-structural', diff:3,
  stem:'A simply supported beam has w = 2 kip/ft, L = 24 ft, E = 29,000 ksi, I = 1,000 in\u2074. What is the midspan deflection?',

  stem:'A field SPT gives N = 20 with a 60% efficiency hammer at an effective overburden of 2,000 psf. Using C_N = \u221A(2,000/\u03C3\u2032_v) with \u03C3\u2032_v in psf, what is (N\u2081)\u2086\u2080?',
  choices:['14','20','28','40'], answer:1,
  solution:'C_N = \u221A(2,000/2,000) = 1.0\n(N\u2081)\u2086\u2080 = C_N \u00D7 N\u2086\u2080 = 1.0(20) = 20.\nAt \u03C3\u2032_v = 2,000 psf (\u22481 tsf) the correction factor is unity by definition.',
  formula:'(N\u2081)\u2086\u2080 = C_N N\u2086\u2080' },
{ id:'pg-2', track:'pe-geotech', topic:'pg-site', diff:2,
  stem:'A rock core run of 60 in recovers pieces \u2265 4 in long totaling 42 in. What is the RQD and rock quality description?',
  choices:['70% \u2014 fair','70% \u2014 good','42% \u2014 poor','84% \u2014 good'], answer:0,
  solution:'RQD = \u03A3(pieces \u2265 4 in)/total run length = 42/60 = 70%.\nClassification: 0\u201325 very poor, 25\u201350 poor, 50\u201375 fair, 75\u201390 good, 90\u2013100 excellent.\n70% falls in the 50\u201375 band \u2192 fair.',
  formula:'RQD = \u03A3L(\u22654 in)/L_total' },
{ id:'pg-3', track:'pe-geotech', topic:'pg-soil', diff:2,
  stem:'A soil sample has a moist unit weight of 125 pcf at w = 15%. What is the dry unit weight?',
  choices:['106.4 pcf','108.7 pcf','112.5 pcf','118.2 pcf'], answer:1,
  solution:'\u03B3_d = \u03B3/(1 + w) = 125/1.15 = 108.7 pcf.',
  formula:'\u03B3_d = \u03B3/(1+w)' },
{ id:'pg-4', track:'pe-geotech', topic:'pg-soil', diff:2,
  stem:'A direct shear test on sand gives \u03C4 = 1,500 psf at \u03C3\u2032 = 2,600 psf. What is the friction angle?',
  choices:['24.5\u00B0','30.0\u00B0','35.0\u00B0','40.0\u00B0'], answer:1,
  solution:'For cohesionless soil, \u03C4 = \u03C3\u2032tan\u03D5\ntan\u03D5 = 1,500/2,600 = 0.5769\n\u03D5 = 30.0\u00B0.',
  formula:'\u03C4 = c\u2032 + \u03C3\u2032tan\u03D5\u2032' },
{ id:'pg-5', track:'pe-geotech', topic:'pg-water', diff:3,
  stem:'A flow net beneath a dam has N_f = 4 flow channels and N_d = 12 equipotential drops, with k = 2\u00D710\u207B\u2074 ft/s and total head loss 20 ft. What is the seepage per foot of dam?',
  choices:['6.7\u00D710\u207B\u2074 cfs/ft','1.33\u00D710\u207B\u00B3 cfs/ft','2.67\u00D710\u207B\u00B3 cfs/ft','4.00\u00D710\u207B\u00B3 cfs/ft'], answer:1,
  solution:'q = kH(N_f/N_d) = 2\u00D710\u207B\u2074(20)(4/12)\n= 2\u00D710\u207B\u2074(20)(0.3333) = 1.33\u00D710\u207B\u00B3 cfs per foot.',
  formula:'q = kH(N_f/N_d)' },
{ id:'pg-6', track:'pe-geotech', topic:'pg-water', diff:3,
  stem:'Upward seepage occurs in sand with \u03B3_sat = 125 pcf. What is the critical hydraulic gradient?',
  choices:['0.50','1.00','1.50','2.00'], answer:1,
  solution:'i_cr = \u03B3\u2032/\u03B3_w = (125 \u2212 62.4)/62.4 = 62.6/62.4 = 1.00.\nQuick condition (boiling) occurs when the upward gradient reaches i_cr.',
  formula:'i_cr = \u03B3\u2032/\u03B3_w = (G\u209B\u22121)/(1+e)' },
{ id:'pg-7', track:'pe-geotech', topic:'pg-shallow', diff:3,
  stem:'A 6-ft square footing bears 4 ft deep in clay with c = 1,200 psf, \u03D5 = 0, \u03B3 = 120 pcf. Using q_ult = 1.3cN_c + \u03B3D_f with N_c = 5.14, what is q_ult?',
  choices:['5,500 psf','8,500 psf','8,498 psf','9,500 psf'], answer:2,
  solution:'1.3cN_c = 1.3(1,200)(5.14) = 8,018 psf\n\u03B3D_f = 120(4) = 480 psf\nq_ult = 8,018 + 480 = 8,498 psf.',
  formula:'q_ult = 1.3cN_c + \u03B3D_fN_q + 0.4\u03B3BN_\u03B3' },
{ id:'pg-8', track:'pe-geotech', topic:'pg-shallow', diff:2,
  stem:'A footing has q_ult = 9,000 psf. Using a factor of safety of 3, what is the allowable bearing pressure?',
  choices:['2,000 psf','3,000 psf','4,500 psf','6,000 psf'], answer:1,
  solution:'q_all = q_ult/FS = 9,000/3 = 3,000 psf.\nNote: some practices apply FS to the net ultimate bearing capacity instead.',
  formula:'q_all = q_ult/FS' },
{ id:'pg-9', track:'pe-geotech', topic:'pg-deep', diff:3,
  stem:'A 12-in diameter, 40-ft pile in clay has c_u = 1,000 psf and \u03B1 = 0.55. What is the ultimate skin friction capacity?',
  choices:['46 kip','69 kip','82 kip','104 kip'], answer:1,
  solution:'Perimeter = \u03C0D = \u03C0(1.0) = 3.14 ft\nSurface area = 3.14(40) = 125.7 ft\u00B2\nf\u209B = \u03B1c_u = 0.55(1,000) = 550 psf\nQ\u209B = 550(125.7) = 69,100 lb \u2248 69 kip.',
  formula:'Q\u209B = \u03B1c_u \u00B7 A_surface' },
{ id:'pg-10', track:'pe-geotech', topic:'pg-deep', diff:3,
  stem:'A 3\u00D73 pile group with 12-in piles at 3-ft spacing has a group efficiency of 0.75. If a single pile capacity is 80 kip, what is the group capacity?',
  choices:['360 kip','480 kip','540 kip','720 kip'], answer:2,
  solution:'Q_group = \u03B7 \u00D7 n \u00D7 Q_single = 0.75(9)(80)\n= 0.75(720) = 540 kip.',
  formula:'Q_group = \u03B7 n Q_single' },
{ id:'pg-11', track:'pe-geotech', topic:'pg-deep', diff:3,
  stem:'Negative skin friction (downdrag) on a pile occurs when:',
  choices:['The pile settles more than the surrounding soil','The surrounding soil settles more than the pile','The pile is loaded laterally','Groundwater rises above the pile cap'], answer:1,
  solution:'When the surrounding soil settles more than the pile (typically from consolidation of a compressible layer under new fill), the soil drags down on the shaft, adding load rather than resisting it.' },
{ id:'pg-12', track:'pe-geotech', topic:'pg-retain', diff:2,
  stem:'A 20-ft wall retains sand with \u03B3 = 115 pcf, \u03D5 = 32\u00B0. What is the at-rest thrust per foot (normally consolidated)?',
  choices:['8,650 lb/ft','10,810 lb/ft','12,190 lb/ft','14,375 lb/ft'], answer:1,
  solution:'K\u2080 = 1 \u2212 sin\u03D5 = 1 \u2212 sin32\u00B0 = 1 \u2212 0.530 = 0.470\nP\u2080 = \u00BDK\u2080\u03B3H\u00B2\n= 0.5(0.470)(115)(20)\u00B2\n= 0.5(0.470)(115)(400) = 10,810 lb/ft.',
  formula:'K\u2080 = 1 \u2212 sin\u03D5 ; P\u2080 = \u00BDK\u2080\u03B3H\u00B2' },
{ id:'pg-13', track:'pe-geotech', topic:'pg-retain', diff:3,
  stem:'A wall retains soil with \u03D5 = 30\u00B0 and carries a uniform surcharge q = 400 psf over 15 ft of height. What is the additional lateral thrust from the surcharge alone?',
  choices:['1,000 lb/ft','1,500 lb/ft','2,000 lb/ft','3,000 lb/ft'], answer:2,
  solution:'K_a = tan\u00B2(45 \u2212 15) = 0.333\n\u0394p = K_a q = 0.333(400) = 133.3 psf (uniform)\nP_q = 133.3(15) = 2,000 lb/ft.',
  formula:'P_surcharge = K_a q H' },
{ id:'pg-14', track:'pe-geotech', topic:'pg-retain', diff:3,
  stem:'A gravity wall weighs 12,000 lb/ft, the base friction coefficient is 0.50, and the driving thrust is 4,500 lb/ft. What is the factor of safety against sliding?',
  choices:['1.00','1.33','1.50','2.67'], answer:1,
  solution:'Resisting force = \u03BCW = 0.50(12,000) = 6,000 lb/ft\nFS = 6,000/4,500 = 1.33.\nTypical minimum FS against sliding is 1.5, so this wall is inadequate.',
  formula:'FS_slide = \u03BCW/P_a' },
{ id:'pg-15', track:'pe-geotech', topic:'pg-slope', diff:3,
  stem:'A saturated clay slope has c_u = 800 psf, height 20 ft, \u03B3 = 120 pcf, and a stability number N\u209B = 0.181. What is the factor of safety?',
  choices:['1.10','1.33','1.84','2.20'], answer:2,
  solution:'Using FS = c_u/(N\u209B\u03B3H):\nN\u209B\u03B3H = 0.181(120)(20) = 434.4 psf\nFS = 800/434.4 = 1.84.',
  formula:'FS = c_u/(N\u209B\u03B3H)' },
{ id:'pg-16', track:'pe-geotech', topic:'pg-slope', diff:2,
  stem:'In the ordinary method of slices, the factor of safety for a slope is computed as:',
  choices:['\u03A3 driving moments / \u03A3 resisting moments','\u03A3 resisting moments / \u03A3 driving moments','\u03A3 normal forces / \u03A3 shear forces','Total weight / total cohesion'], answer:1,
  solution:'FS = \u03A3 resisting (shear strength) moments \u00F7 \u03A3 driving (weight component) moments about the center of the trial circle. A value greater than 1.0 indicates stability.',
  formula:'FS = \u03A3M_resist/\u03A3M_drive' },
{ id:'pg-17', track:'pe-geotech', topic:'pg-improve', diff:2,
  stem:'Prefabricated vertical drains (wick drains) are used primarily to:',
  choices:['Increase the shear strength of sand','Accelerate consolidation of soft compressible soils','Provide lateral reinforcement in slopes','Reduce liquefaction in gravels'], answer:1,
  solution:'Wick drains shorten the drainage path, converting long vertical drainage into short radial drainage. This dramatically reduces the time required for primary consolidation under a surcharge.' },
{ id:'pg-18', track:'pe-geotech', topic:'pg-improve', diff:2,
  stem:'A subgrade has a CBR of 8. Using the correlation M_R (psi) = 1,500 \u00D7 CBR, what is the resilient modulus?',
  choices:['8,000 psi','10,500 psi','12,000 psi','15,000 psi'], answer:2,
  solution:'M_R = 1,500(8) = 12,000 psi.\nThis correlation is generally applicable for fine-grained soils with CBR \u2264 10.',
  formula:'M_R = 1,500 \u00D7 CBR' },

/* ================= PE TRANSPORTATION ================= */
{ id:'pt-1', track:'pe-transpo', topic:'pt-traffic', diff:3,
  stem:'An approach has 1,200 veh/hr demand, capacity 1,600 veh/hr. Using the v/c ratio, what is the degree of saturation?',
  choices:['0.60','0.75','0.85','1.33'], answer:1,
  solution:'X = v/c = 1,200/1,600 = 0.75.\nDegrees of saturation above about 0.85\u20130.95 signal capacity concerns at signalized intersections.',
  formula:'X = v/c' },
{ id:'pt-2', track:'pe-transpo', topic:'pt-traffic', diff:3,
  stem:'A segment had 12 crashes in 3 years with an ADT of 8,000 vehicles over 2 miles. What is the crash rate per 100 million VMT?',
  choices:['34.2','68.5','137.0','205.5'], answer:1,
  solution:'VMT = 8,000 \u00D7 2 mi \u00D7 365 \u00D7 3 = 17,520,000 veh-mi\nRate = 12 \u00D7 10\u2078/17,520,000 = 68.5 crashes per 100 MVM.',
  formula:'Rate = (crashes \u00D7 10\u2078)/(ADT \u00D7 L \u00D7 365 \u00D7 yrs)' },
{ id:'pt-3', track:'pe-transpo', topic:'pt-horiz', diff:3,
  stem:'A horizontal curve has a degree of curve D = 5\u00B0 (arc definition). What is the radius?',
  choices:['955 ft','1,146 ft','1,432 ft','1,910 ft'], answer:1,
  solution:'R = 5,729.58/D = 5,729.58/5 = 1,145.9 \u2248 1,146 ft.',
  formula:'R = 5,729.58/D' },
{ id:'pt-4', track:'pe-transpo', topic:'pt-horiz', diff:3,
  stem:'A 55-mph curve requires a middle ordinate of 20 ft for sight distance. With R = 1,500 ft, what horizontal sightline offset is available if an obstruction sits 15 ft from the centerline?',
  choices:['Adequate \u2014 offset exceeds required M','Inadequate \u2014 obstruction is closer than required M','Exactly adequate','Cannot be determined'], answer:1,
  solution:'Required middle ordinate M = 20 ft, but the obstruction sits only 15 ft from the centerline. Since 15 ft < 20 ft, the available sight line is blocked and the sight distance is inadequate. Remedies: remove the obstruction, flatten the curve, or lower the design speed.',
  formula:'M = R[1 \u2212 cos(28.65 S/R)]' },
{ id:'pt-5', track:'pe-transpo', topic:'pt-vert', diff:3,
  stem:'A sag vertical curve joins \u22123% and +2% grades at 50 mph. With K = 96 for sag curves at 50 mph, what is the minimum curve length?',
  choices:['288 ft','384 ft','480 ft','576 ft'], answer:2,
  solution:'A = |G\u2082 \u2212 G\u2081| = |2 \u2212 (\u22123)| = 5%\nL = KA = 96(5) = 480 ft.',
  formula:'L = KA' },
{ id:'pt-6', track:'pe-transpo', topic:'pt-vert', diff:3,
  stem:'A vertical curve has PVC at station 10+00, elevation 250.00 ft, G\u2081 = +3%, L = 600 ft, G\u2082 = \u22121%. What is the elevation at the PVT?',
  choices:['250.00 ft','253.00 ft','256.00 ft','262.00 ft'], answer:2,
  solution:'PVI is 300 ft from PVC: Elev_PVI = 250 + 0.03(300) = 259.00 ft\nPVT is 300 ft beyond PVI: Elev_PVT = 259 \u2212 0.01(300) = 256.00 ft.',
  formula:'Elev = Elev\u2080 + G\u00B7x' },
{ id:'pt-7', track:'pe-transpo', topic:'pt-drain', diff:2,
  stem:'A 25-acre watershed with C = 0.45 experiences i = 3.2 in/hr. What is the peak flow?',
  choices:['16 cfs','26 cfs','36 cfs','46 cfs'], answer:2,
  solution:'Q = CiA = 0.45(3.2)(25) = 36 cfs.',
  formula:'Q = CiA' },
{ id:'pt-8', track:'pe-transpo', topic:'pt-drain', diff:3,
  stem:'A circular culvert flowing full has D = 4 ft, n = 0.013, S = 0.005. What is the capacity by Manning\u2019s equation?',
  choices:['76 cfs','102 cfs','128 cfs','154 cfs'], answer:1,
  solution:'A = \u03C0D\u00B2/4 = \u03C0(4)\u00B2/4 = 12.57 ft\u00B2\nR = D/4 = 1.0 ft (full circular pipe)\nQ = (1.486/n)AR^(2/3)S^(1/2)\n= (1.486/0.013)(12.57)(1.0)(0.0707)\n= 114.3(12.57)(0.0707) = 102 cfs.',
  formula:'Q = (1.486/n)AR^(2/3)S^(1/2)' },
{ id:'pt-9', track:'pe-transpo', topic:'pt-intersect', diff:2,
  stem:'The design vehicle that governs turning radii at an intersection serving a distribution warehouse is most likely:',
  choices:['Passenger car (P)','Single-unit truck (SU-30)','Intermediate semitrailer (WB-40)','Interstate semitrailer (WB-62/WB-67)'], answer:3,
  solution:'Distribution warehouses are served by the largest legal combination trucks. The WB-62 (or WB-67) interstate semitrailer governs turning radii, and its swept path drives corner radius and lane width design.' },
{ id:'pt-10', track:'pe-transpo', topic:'pt-intersect', diff:3,
  stem:'A modern roundabout typically improves safety over a conventional intersection primarily because it:',
  choices:['Increases the number of conflict points','Eliminates crossing conflicts and reduces speeds','Requires signal control','Increases approach speeds'], answer:1,
  solution:'Roundabouts cut vehicle conflict points from 32 to 8 at a four-leg intersection, eliminate high-severity right-angle and left-turn crossing conflicts, and force low entry speeds through deflection.' },
{ id:'pt-11', track:'pe-transpo', topic:'pt-cross', diff:2,
  stem:'For a high-speed rural highway with a 6:1 fill slope and ADT above 6,000, the clear zone width is best determined from:',
  choices:['The MUTCD','The AASHTO Roadside Design Guide','The Highway Capacity Manual','ASCE 7'], answer:1,
  solution:'The AASHTO Roadside Design Guide provides clear zone distance tables as a function of design speed, ADT, and roadside slope. MUTCD covers traffic control devices; HCM covers capacity; ASCE 7 covers structural loads.' },
{ id:'pt-12', track:'pe-transpo', topic:'pt-pave', diff:3,
  stem:'A flexible pavement has layers with a\u2081 = 0.44 (4 in AC), a\u2082 = 0.14 (8 in base, m\u2082 = 1.0). What is the structural number?',
  choices:['1.76','2.20','2.88','3.52'], answer:2,
  solution:'SN = a\u2081D\u2081 + a\u2082D\u2082m\u2082\n= 0.44(4) + 0.14(8)(1.0)\n= 1.76 + 1.12 = 2.88.',
  formula:'SN = \u03A3 a\u1D62D\u1D62m\u1D62' },
{ id:'pt-13', track:'pe-transpo', topic:'pt-pave', diff:3,
  stem:'A design lane carries 500 trucks/day with an average of 1.2 ESALs per truck over a 20-year period with no growth. What is the total design ESAL?',
  choices:['2.19 million','4.38 million','6.57 million','8.76 million'], answer:1,
  solution:'ESAL/day = 500(1.2) = 600\nAnnual = 600(365) = 219,000\n20 years = 219,000(20) = 4,380,000 = 4.38 million.',
  formula:'ESAL = trucks \u00D7 factor \u00D7 365 \u00D7 years' },
{ id:'pt-14', track:'pe-transpo', topic:'pt-signal', diff:3,
  stem:'Using Webster\u2019s formula with L = 12 s total lost time and \u03A3Y = 0.70, what is the optimum cycle length?',
  choices:['52 s','63 s','77 s','96 s'], answer:2,
  solution:'C\u2092 = (1.5L + 5)/(1 \u2212 \u03A3Y)\n= (1.5 \u00D7 12 + 5)/(1 \u2212 0.70)\n= (18 + 5)/0.30\n= 23/0.30 = 76.7 \u2248 77 s.',
  formula:'C\u2092 = (1.5L + 5)/(1 \u2212 \u03A3Y)' },
{ id:'pt-15', track:'pe-transpo', topic:'pt-signal', diff:3,
  stem:'An approach has a 45-mph speed, 2.5-ft/s\u00B2... Actually: compute the yellow interval for 45 mph with t = 1.0 s, a = 10 ft/s\u00B2, level grade.',
  choices:['2.9 s','4.3 s','5.1 s','6.0 s'], answer:1,
  solution:'v = 45 mph = 66 ft/s\ny = t + v/(2a + 64.4g) with g = 0\n= 1.0 + 66/(2 \u00D7 10) = 1.0 + 3.3 = 4.3 s.',
  formula:'y = t + v/(2a + 64.4G)' },
{ id:'pt-16', track:'pe-transpo', topic:'pt-control', diff:2,
  stem:'In a work zone on a 55-mph highway with a 12-ft lane shift, the minimum taper length L is computed as:',
  choices:['L = WS\u00B2/60','L = WS','L = W\u00B2S/60','L = 2WS'], answer:1,
  solution:'For speeds of 45 mph and above, MUTCD gives L = WS, where W is the offset width in feet and S is the posted speed in mph. For speeds of 40 mph or less, L = WS\u00B2/60.\nHere L = 12(55) = 660 ft.',
  formula:'S \u2265 45: L = WS ; S \u2264 40: L = WS\u00B2/60' },
{ id:'pt-17', track:'pe-transpo', topic:'pt-pm', diff:2,
  stem:'An activity has a normal duration of 10 days at $10,000 and a crash duration of 6 days at $18,000. What is the cost slope?',
  choices:['$800/day','$1,600/day','$2,000/day','$3,000/day'], answer:2,
  solution:'Cost slope = (Crash cost \u2212 Normal cost)/(Normal duration \u2212 Crash duration)\n= (18,000 \u2212 10,000)/(10 \u2212 6) = 8,000/4 = $2,000/day.',
  formula:'Slope = \u0394Cost/\u0394Time' },
{ id:'pt-18', track:'pe-transpo', topic:'pt-pm', diff:2,
  stem:'A NEPA Categorical Exclusion applies to a project that:',
  choices:['Has significant environmental impacts','Requires a full Environmental Impact Statement','Does not individually or cumulatively have a significant environmental effect','Is funded entirely with state money'], answer:2,
  solution:'A Categorical Exclusion (CE) covers actions that do not individually or cumulatively have significant environmental effects. Projects with uncertain impacts require an Environmental Assessment; those with significant impacts require an EIS.' },

/* ================= PE WATER RESOURCES ================= */
{ id:'pw-1', track:'pe-wre', topic:'pw-closed', diff:3,
  stem:'Water flows through 2,000 ft of 12-in ductile iron pipe (C = 130) at 3 cfs. Using Hazen-Williams, what is the head loss?',
  choices:['5.8 ft','8.8 ft','12.4 ft','16.2 ft'], answer:1,
  solution:'Use Q in gpm and d in inches.\nQ = 3 cfs \u00D7 448.83 = 1,346 gpm\nh_f = 10.44 L Q^1.85/(C^1.85 d^4.87)\n= 10.44(2,000)(1,346)^1.85/[(130)^1.85(12)^4.87]\n= 8.76 ft \u2248 8.8 ft.',
  formula:'h_f = 10.44LQ^1.85/(C^1.85 d^4.87)' },
{ id:'pw-2', track:'pe-wre', topic:'pw-closed', diff:3,
  stem:'A pump has a suction lift where atmospheric head is 33.9 ft, vapor pressure head is 0.6 ft, static lift is 12 ft, and friction loss is 3 ft. What is NPSH available?',
  choices:['15.3 ft','18.3 ft','21.3 ft','24.3 ft'], answer:1,
  solution:'NPSH_A = h_atm \u2212 h_vap \u2212 h_static lift \u2212 h_friction\n= 33.9 \u2212 0.6 \u2212 12 \u2212 3 = 18.3 ft.\nNPSH_A must exceed NPSH_R to avoid cavitation.',
  formula:'NPSH_A = h_atm \u2212 h_vp \u2212 h_s \u2212 h_f' },
{ id:'pw-3', track:'pe-wre', topic:'pw-open', diff:3,
  stem:'A rectangular channel 10 ft wide carries 200 cfs. What is the critical depth?',
  choices:['1.85 ft','2.32 ft','2.72 ft','3.15 ft'], answer:1,
  solution:'q = Q/b = 200/10 = 20 cfs/ft\ny_c = (q\u00B2/g)^(1/3) = (20\u00B2/32.2)^(1/3)\n= (12.42)^(1/3) = 2.32 ft.\nCheck: 2.32\u00B3 = 12.5 \u2713',
  formula:'y_c = (q\u00B2/g)^(1/3)' },
{ id:'pw-4', track:'pe-wre', topic:'pw-open', diff:3,
  stem:'Flow at depth 1.0 ft with velocity 12 fps in a rectangular channel. What is the Froude number and flow regime?',
  choices:['0.67 \u2014 subcritical','1.00 \u2014 critical','2.11 \u2014 supercritical','4.20 \u2014 supercritical'], answer:2,
  solution:'Fr = V/\u221A(gy) = 12/\u221A(32.2 \u00D7 1.0) = 12/5.67 = 2.11.\nFr > 1 indicates supercritical (rapid) flow.',
  formula:'Fr = V/\u221A(gy)' },
{ id:'pw-5', track:'pe-wre', topic:'pw-hydro', diff:3,
  stem:'A watershed has CN = 80. What is the potential maximum retention S?',
  choices:['1.5 in','2.5 in','3.5 in','4.5 in'], answer:1,
  solution:'S = 1,000/CN \u2212 10 = 1,000/80 \u2212 10 = 12.5 \u2212 10 = 2.5 in.',
  formula:'S = 1000/CN \u2212 10' },
{ id:'pw-6', track:'pe-wre', topic:'pw-hydro', diff:3,
  stem:'With S = 2.5 in and P = 4.0 in, what is the NRCS direct runoff Q? (I_a = 0.2S)',
  choices:['1.48 in','1.72 in','2.04 in','2.62 in'], answer:2,
  solution:'I_a = 0.2S = 0.2(2.5) = 0.5 in\nQ = (P \u2212 0.2S)\u00B2/(P + 0.8S)\n= (4.0 \u2212 0.5)\u00B2/(4.0 + 2.0)\n= 12.25/6.0 = 2.04 in.',
  formula:'Q = (P\u22120.2S)\u00B2/(P+0.8S)' },
{ id:'pw-7', track:'pe-wre', topic:'pw-gw', diff:3,
  stem:'A confined aquifer has T = 5,000 gpd/ft, and two observation wells 100 ft and 500 ft from a pumping well show drawdowns of 8 ft and 2 ft. Using Thiem, what is Q?',
  choices:['58,600 gpd','82,300 gpd','117,000 gpd','164,000 gpd'], answer:2,
  solution:'Thiem equation for a confined aquifer:\nQ = 2\u03C0T(s\u2081 \u2212 s\u2082)/ln(r\u2082/r\u2081)\n\u0394s = 8 \u2212 2 = 6 ft ; ln(500/100) = ln 5 = 1.609\nQ = 2\u03C0(5,000)(6)/1.609\n= 188,496/1.609 = 117,000 gpd.',
  formula:'Q = 2\u03C0T\u0394s/ln(r\u2082/r\u2081)' },
{ id:'pw-8', track:'pe-wre', topic:'pw-wastewater', diff:3,
  stem:'An activated sludge system has V = 1.0 MG, MLSS = 2,500 mg/L, and wastes 10,000 lb/day of solids... Given Q = 5 MGD and influent BOD = 200 mg/L, what is the F:M ratio?',
  choices:['0.20 /day','0.40 /day','0.60 /day','0.80 /day'], answer:1,
  solution:'Food = 5 MGD \u00D7 200 mg/L \u00D7 8.34 = 8,340 lb BOD/day\nMass = 1.0 MG \u00D7 2,500 \u00D7 8.34 = 20,850 lb MLSS\nF:M = 8,340/20,850 = 0.40 /day.',
  formula:'F:M = BOD load / MLSS mass' },
{ id:'pw-9', track:'pe-wre', topic:'pw-wastewater', diff:2,
  stem:'A clarifier is 80 ft in diameter treating 3 MGD. What is the surface overflow rate?',
  choices:['397 gpd/ft\u00B2','497 gpd/ft\u00B2','597 gpd/ft\u00B2','697 gpd/ft\u00B2'], answer:2,
  solution:'A = \u03C0(80)\u00B2/4 = 5,027 ft\u00B2\nSOR = 3,000,000/5,027 = 597 gpd/ft\u00B2.',
  formula:'SOR = Q/A' },
{ id:'pw-10', track:'pe-wre', topic:'pw-quality', diff:3,
  stem:'A stream has DO = 6.0 mg/L and saturation DO = 9.2 mg/L. What is the dissolved oxygen deficit?',
  choices:['2.2 mg/L','3.2 mg/L','4.2 mg/L','6.0 mg/L'], answer:1,
  solution:'D = DO_sat \u2212 DO_actual = 9.2 \u2212 6.0 = 3.2 mg/L.\nThis deficit drives reaeration in the Streeter-Phelps oxygen sag model.',
  formula:'D = DO_sat \u2212 DO' },
{ id:'pw-11', track:'pe-wre', topic:'pw-drinking', diff:3,
  stem:'A contact basin provides 30 minutes of contact time with a chlorine residual of 1.5 mg/L. What is the CT value?',
  choices:['20 mg\u00B7min/L','30 mg\u00B7min/L','45 mg\u00B7min/L','60 mg\u00B7min/L'], answer:2,
  solution:'CT = C \u00D7 T = 1.5 mg/L \u00D7 30 min = 45 mg\u00B7min/L.\nCT requirements vary with pH, temperature, and target log inactivation.',
  formula:'CT = C \u00D7 T' },
{ id:'pw-12', track:'pe-wre', topic:'pw-drinking', diff:2,
  stem:'A rapid sand filter treats 4 MGD with a filtration rate of 4 gpm/ft\u00B2. What total filter area is required?',
  choices:['475 ft\u00B2','695 ft\u00B2','834 ft\u00B2','1,000 ft\u00B2'], answer:1,
  solution:'Q = 4,000,000 gpd \u00F7 1,440 = 2,778 gpm\nA = 2,778/4 = 694.5 \u2248 695 ft\u00B2.',
  formula:'A = Q/rate' },
{ id:'pw-13', track:'pe-wre', topic:'pw-site', diff:2,
  stem:'A trench 6 ft deep, 3 ft wide, and 500 ft long is excavated. What is the volume in cubic yards?',
  choices:['200 cy','300 cy','333 cy','400 cy'], answer:2,
  solution:'V = 6(3)(500) = 9,000 ft\u00B3\n9,000/27 = 333 cy.',
  formula:'V = LWD/27' },
{ id:'pw-14', track:'pe-wre', topic:'pw-site', diff:2,
  stem:'Under the NPDES construction general permit, a SWPPP is required for land disturbance of:',
  choices:['0.5 acre or more','1 acre or more','5 acres or more','10 acres or more'], answer:1,
  solution:'The NPDES construction general permit requires a Stormwater Pollution Prevention Plan for sites disturbing one acre or more, including smaller sites that are part of a larger common plan of development.' },
{ id:'pw-15', track:'pe-wre', topic:'pw-soil', diff:2,
  stem:'A soil has a permeability of 1\u00D710\u207B\u2077 cm/s. This is characteristic of:',
  choices:['Clean gravel','Clean sand','Silt','Clay'], answer:3,
  solution:'Typical ranges: gravel > 1 cm/s, clean sand 10\u207B\u00B9 to 10\u207B\u00B3 cm/s, silt 10\u207B\u2074 to 10\u207B\u2076 cm/s, clay < 10\u207B\u2076 cm/s. A value of 10\u207B\u2077 cm/s indicates clay (practically impervious).' },
{ id:'pw-16', track:'pe-wre', topic:'pw-mat', diff:2,
  stem:'Ductile iron pipe in aggressive soils is commonly protected by:',
  choices:['Polyethylene encasement','Increasing the wall thickness only','Painting the interior','Using higher pressure class only'], answer:0,
  solution:'Loose polyethylene encasement (per ANSI/AWWA C105) is the standard, economical corrosion protection for ductile iron pipe in corrosive soils. Thicker walls do not stop galvanic or bacterial corrosion.' },
{ id:'pw-17', track:'pe-wre', topic:'pw-plan', diff:2,
  stem:'A project costs $500,000 initially with $20,000/yr O&M over 25 years at 5%. What is the present worth of the O&M?',
  choices:['$218,000','$282,000','$338,000','$500,000'], answer:1,
  solution:'(P/A, 5%, 25) = [1 \u2212 (1.05)\u207B\u00B2\u2075]/0.05\n(1.05)\u00B2\u2075 = 3.386 \u2192 (1.05)\u207B\u00B2\u2075 = 0.2953\n= (1 \u2212 0.2953)/0.05 = 14.09\nPW = 20,000(14.09) = $281,900 \u2248 $282,000.',
  formula:'P = A(P/A, i, n)' },
{ id:'pw-18', track:'pe-wre', topic:'pw-econ', diff:2,
  stem:'Two alternatives: A costs $100,000 with $12,000/yr; B costs $150,000 with $6,000/yr. At 6% over 20 years, which has lower present worth?',
  choices:['A, by about $12,000','B, by about $19,000','A, by about $50,000','They are identical'], answer:1,
  solution:'(P/A, 6%, 20) = 11.4699\nPW_A = 100,000 + 12,000(11.4699) = $237,639\nPW_B = 150,000 + 6,000(11.4699) = $218,819\nB is lower by $18,820 \u2248 $19,000.',
  formula:'PW = First cost + A(P/A, i, n)' },

/* ================= PE CONSTRUCTION ================= */
{ id:'pc-1', track:'pe-construction', topic:'pc-earth', diff:2,
  stem:'Soil has a swell factor of 25% from bank to loose. If 800 bcy are excavated, how many lcy must be hauled?',
  choices:['640 lcy','800 lcy','1,000 lcy','1,250 lcy'], answer:2,
  solution:'LCY = BCY(1 + swell) = 800(1.25) = 1,000 lcy.',
  formula:'LCY = BCY(1 + swell)' },
{ id:'pc-2', track:'pe-construction', topic:'pc-earth', diff:3,
  stem:'A mass haul diagram shows a balance line. The area between the mass curve and the balance line represents:',
  choices:['The haul distance only','The volume of material only','Haul (volume \u00D7 distance), used to compute overhaul','The cost of the excavation'], answer:2,
  solution:'On a mass haul diagram the vertical axis is cumulative volume and the horizontal axis is station. The enclosed area therefore has units of volume \u00D7 distance (station-yards), which is haul and forms the basis for overhaul payment.' },
{ id:'pc-3', track:'pe-construction', topic:'pc-est', diff:2,
  stem:'A concrete wall is 100 ft long, 12 in thick, and 10 ft tall. With 5% waste, how much concrete should be ordered?',
  choices:['37.0 cy','38.9 cy','40.0 cy','42.5 cy'], answer:1,
  solution:'V = 100(1.0)(10) = 1,000 ft\u00B3 = 37.04 cy\nWith 5% waste: 37.04(1.05) = 38.9 cy.',
  formula:'V = LWH/27 \u00D7 (1 + waste)' },
{ id:'pc-4', track:'pe-construction', topic:'pc-est', diff:3,
  stem:'A project has BCWS = $800,000, BCWP = $750,000, ACWP = $820,000. What is the schedule variance?',
  choices:['\u2212$70,000','\u2212$50,000','+$20,000','+$50,000'], answer:1,
  solution:'SV = BCWP \u2212 BCWS = 750,000 \u2212 800,000 = \u2212$50,000.\nNegative SV means the project is behind schedule.\n(CV = BCWP \u2212 ACWP = \u2212$70,000, also over budget.)',
  formula:'SV = EV \u2212 PV ; CV = EV \u2212 AC' },
{ id:'pc-5', track:'pe-construction', topic:'pc-ops', diff:3,
  stem:'A crane must lift 18,000 lb at a 40-ft radius. The load chart rating at that radius is 22,000 lb. The rigging weighs 1,200 lb. What is the percent of capacity?',
  choices:['81.8%','87.3%','92.5%','100%'], answer:1,
  solution:'Total load = 18,000 + 1,200 = 19,200 lb\nPercent = 19,200/22,000 = 87.3%.\nMost contractors require a review above 75\u201380%, and lifts over 90% are typically critical lifts.',
  formula:'% capacity = (load + rigging)/rated capacity' },
{ id:'pc-6', track:'pe-construction', topic:'pc-ops', diff:2,
  stem:'A backhoe has a bucket capacity of 1.5 lcy, a cycle time of 20 seconds, and works at 45 min/hr efficiency. What is the hourly production?',
  choices:['135 lcy/hr','162 lcy/hr','180 lcy/hr','203 lcy/hr'], answer:3,
  solution:'Working 45 min/hr at a 20-second cycle:\nCycles/hr = (45 \u00D7 60 s)/20 s = 135 cycles\nProduction = 135 \u00D7 1.5 lcy = 202.5 \u2248 203 lcy/hr.',
  formula:'Production = cycles/hr \u00D7 capacity \u00D7 fill factor' },
{ id:'pc-7', track:'pe-construction', topic:'pc-sched', diff:3,
  stem:'Activities: A (5d) \u2192 C (8d); B (7d) \u2192 C. C \u2192 D (4d). What is the project duration?',
  choices:['15 days','17 days','19 days','24 days'], answer:2,
  solution:'C cannot start until both A and B finish: max(5, 7) = 7 days\nC finishes at 7 + 8 = 15\nD finishes at 15 + 4 = 19 days.\nCritical path: B \u2192 C \u2192 D.',
  formula:'EF = max(predecessor EFs) + duration' },
{ id:'pc-8', track:'pe-construction', topic:'pc-sched', diff:3,
  stem:'An activity has a free float of 0 but a total float of 4 days. This means:',
  choices:['The activity is on the critical path','Delaying it will delay a successor\u2019s early start but not the project','It has no successors','The schedule is invalid'], answer:1,
  solution:'Free float is the delay available without affecting any successor\u2019s early start; total float is the delay available without affecting project completion. FF = 0 with TF = 4 means any delay immediately pushes the successor\u2019s early start, but up to 4 days can be absorbed before the project end date slips.' },
{ id:'pc-9', track:'pe-construction', topic:'pc-sched', diff:2,
  stem:'To shorten a project, a scheduler should crash:',
  choices:['The most expensive activity','The longest activity regardless of path','The critical-path activity with the lowest cost slope','Any activity with float'], answer:2,
  solution:'Only critical-path activities control project duration, and crashing should start with the lowest cost slope (least $ per day saved) to minimize added cost. Crashing float activities buys nothing.' },
{ id:'pc-10', track:'pe-construction', topic:'pc-qc', diff:2,
  stem:'A concrete cylinder set requires the average of two 28-day cylinders. Results are 4,250 psi and 4,410 psi against f\u2032c = 4,000 psi. The result is:',
  choices:['Acceptable \u2014 average exceeds f\u2032c and neither is more than 500 psi below','Rejected \u2014 individual variation too high','Inconclusive \u2014 need three cylinders','Rejected \u2014 average must exceed 1.5f\u2032c'], answer:0,
  solution:'ACI 318 acceptance: every arithmetic average of three consecutive strength tests equals or exceeds f\u2032c, and no individual strength test falls below f\u2032c by more than 500 psi (for f\u2032c \u2264 5,000 psi). Average = 4,330 psi > 4,000 psi and both cylinders are well above 3,500 psi. Acceptable.' },
{ id:'pc-11', track:'pe-construction', topic:'pc-qc', diff:3,
  stem:'The concrete maturity method estimates in-place strength using:',
  choices:['Cylinder break results only','Time-temperature history of the concrete','Rebound hammer readings only','Slump measurements'], answer:1,
  solution:'Maturity (ASTM C1074) correlates strength with the accumulated time-temperature history, expressed as the Nurse-Saul time-temperature factor or the Arrhenius equivalent age. It permits earlier formwork removal and post-tensioning decisions based on actual in-place curing.',
  formula:'M = \u03A3(T \u2212 T\u2080)\u0394t' },
{ id:'pc-12', track:'pe-construction', topic:'pc-temp', diff:3,
  stem:'ACI 347 formwork pressure for a column with R = 6 ft/hr, T = 70\u00B0F, using p = C_wC_c[150 + 9,000R/T] gives what pressure (C_w = C_c = 1.0)?',
  choices:['771 psf','921 psf','1,050 psf','1,200 psf'], answer:1,
  solution:'p = 1.0(1.0)[150 + 9,000(6)/70]\n= 150 + 54,000/70\n= 150 + 771 = 921 psf.\nThis must not exceed \u03B3h nor 3,000 psf.',
  formula:'p = C_wC_c[150 + 9,000R/T]' },
{ id:'pc-13', track:'pe-construction', topic:'pc-temp', diff:2,
  stem:'Under OSHA, a trench 5 ft or deeper generally requires:',
  choices:['No protection if soil is Type A','A protective system (sloping, shoring, or shielding)','Only a competent person on site','A permit from the state'], answer:1,
  solution:'OSHA 29 CFR 1926.652 requires a protective system for excavations 5 ft or deeper unless the excavation is made entirely in stable rock. Excavations 20 ft or deeper require a design by a registered professional engineer.' },
{ id:'pc-14', track:'pe-construction', topic:'pc-safety', diff:2,
  stem:'OSHA requires fall protection in construction at heights of:',
  choices:['4 ft','6 ft','10 ft','15 ft'], answer:1,
  solution:'OSHA 29 CFR 1926.501 requires fall protection at 6 ft or more above a lower level in construction. (General industry, 29 CFR 1910, uses 4 ft; scaffolds use 10 ft.)' },
{ id:'pc-15', track:'pe-construction', topic:'pc-safety', diff:2,
  stem:'A "competent person" under OSHA is one who:',
  choices:['Holds a PE license','Is capable of identifying hazards and has authorization to take prompt corrective action','Has 10 years of experience','Is the project superintendent by title'], answer:1,
  solution:'OSHA defines a competent person as one who is capable of identifying existing and predictable hazards and who has authorization to take prompt corrective measures to eliminate them. Neither licensure nor a specific title is required.' },
{ id:'pc-16', track:'pe-construction', topic:'pc-soil', diff:2,
  stem:'A braced excavation in soft clay is most susceptible to:',
  choices:['Base heave','Rock fall','Frost heave','Thermal cracking'], answer:0,
  solution:'Soft clay has low undrained shear strength, so the weight of the retained soil can push material up into the excavation. Base heave (bottom instability) is checked with a stability number N = \u03B3H/c_u; values above about 6 indicate risk.' },
{ id:'pc-17', track:'pe-construction', topic:'pc-layout', diff:2,
  stem:'A building corner is to be staked. The most reliable field check for a rectangular layout is:',
  choices:['Measuring one diagonal','Comparing both diagonals for equality','Measuring the perimeter','Using a hand level'], answer:1,
  solution:'For a rectangle, both diagonals must be equal. Comparing them detects skew that equal side lengths alone would not reveal (a parallelogram has equal opposite sides but unequal diagonals).' },
{ id:'pc-18', track:'pe-construction', topic:'pc-struct', diff:3,
  stem:'A temporary shoring post is a 4\u00D74 (S4S, A = 12.25 in\u00B2) carrying 12,000 lb. What is the compressive stress?',
  choices:['780 psi','980 psi','1,180 psi','1,380 psi'], answer:1,
  solution:'A nominal 4\u00D74 is actually 3.5 in \u00D7 3.5 in = 12.25 in\u00B2\n\u03C3 = P/A = 12,000/12.25 = 980 psi.\nThis must be checked against F\u2032_c including the column stability factor C_P.',
  formula:'\u03C3 = P/A' }
];
