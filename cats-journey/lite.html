  stem:'Lime stabilization is most effective in:',
  choices:['Clean sands','Clays and plastic fine-grained soils','Gravels','Organic peat'], answer:1,
  solution:'Lime reacts with clay minerals through cation exchange and pozzolanic reaction, reducing plasticity and swell while increasing strength. It has little benefit in clean granular soils; cement is used there instead.' },
{ id:'f-pg-8', track:'pe-geotech', topic:'pg-improve', diff:3,
  stem:'A geotextile separating subgrade from base course primarily provides:',
  choices:['Drainage only','Separation and reinforcement','Waterproofing','Thermal insulation'], answer:1,
  solution:'A geotextile at the subgrade/base interface prevents intermixing of fines with the aggregate (separation) and provides tensile reinforcement plus a filtration path, extending pavement life over soft subgrades.' },

/* ---------- PE TRANSPORTATION ---------- */
{ id:'f-pt-1', track:'pe-transpo', topic:'pt-cross', diff:2,
  stem:'A shared-use path per AASHTO should generally have a minimum paved width of:',
  choices:['6 ft','8 ft','10 ft','14 ft'], answer:2,
  solution:'AASHTO recommends a 10-ft minimum paved width for two-directional shared-use paths, with 8 ft allowed only in constrained conditions and 12\u201314 ft where volumes are high.' },
{ id:'f-pt-2', track:'pe-transpo', topic:'pt-cross', diff:3,
  stem:'A roadway has a 12-ft lane and a 2% cross slope. Over the lane width, what is the elevation drop?',
  choices:['0.12 ft','0.24 ft','0.36 ft','0.48 ft'], answer:1,
  solution:'Drop = 0.02(12) = 0.24 ft (about 2.9 in).',
  formula:'\u0394 = slope \u00D7 width' },
{ id:'f-pt-3', track:'pe-transpo', topic:'pt-control', diff:2,
  stem:'A flagger station in a work zone must be preceded by advance warning signs. On a 45-mph road, the first sign is typically placed:',
  choices:['100 ft ahead','350 ft ahead','500 ft ahead','1,000 ft ahead'], answer:1,
  solution:'MUTCD advance warning distances for intermediate-speed roads (35\u201345 mph) are roughly 350 ft between signs. High-speed roads (over 45 mph) use 500\u20131,000 ft, and urban low-speed streets use 100\u2013250 ft.' },
{ id:'f-pt-4', track:'pe-transpo', topic:'pt-control', diff:2,
  stem:'A regulatory sign in the MUTCD is typically:',
  choices:['Yellow with black legend','White with black legend','Orange with black legend','Green with white legend'], answer:1,
  solution:'Regulatory signs (SPEED LIMIT, STOP restrictions, turn prohibitions) are white with a black legend. Yellow is warning, orange is temporary traffic control, and green is guide/destination.' },
{ id:'f-pt-5', track:'pe-transpo', topic:'pt-intersect', diff:3,
  stem:'A single-lane roundabout typically has a capacity per approach of roughly:',
  choices:['400\u2013600 veh/hr','1,000\u20131,300 veh/hr','2,000\u20132,400 veh/hr','3,000+ veh/hr'], answer:1,
  solution:'HCM methods give a single-lane roundabout approach capacity of roughly 1,000\u20131,300 veh/hr at low conflicting flow, decreasing exponentially as circulating volume increases.' },
{ id:'f-pt-6', track:'pe-transpo', topic:'pt-pave', diff:3,
  stem:'A rigid pavement slab is 9 in thick with a 15-ft joint spacing. The primary purpose of the transverse joint is to:',
  choices:['Increase load capacity','Control cracking from shrinkage and thermal movement','Improve skid resistance','Reduce noise'], answer:1,
  solution:'Transverse contraction joints create a weakened plane so that shrinkage and thermal stresses relieve at a planned, sealed location rather than as random cracks. Load transfer across the joint is provided by dowels.' },
{ id:'f-pt-7', track:'pe-transpo', topic:'pt-pm', diff:2,
  stem:'A transportation project requiring an Environmental Impact Statement must evaluate:',
  choices:['Only the preferred alternative','A no-build alternative and reasonable alternatives','Only the least expensive alternative','Only alternatives inside existing right-of-way'], answer:1,
  solution:'NEPA requires an EIS to rigorously evaluate a range of reasonable alternatives, including the no-build (no-action) alternative, which serves as the baseline for comparing impacts.' },
{ id:'f-pt-8', track:'pe-transpo', topic:'pt-horiz', diff:3,
  stem:'A curve has T = 300 ft and \u0394 = 40\u00B0. What is the radius?',
  choices:['549 ft','687 ft','824 ft','1,100 ft'], answer:2,
  solution:'T = R tan(\u0394/2)\nR = T/tan(20\u00B0) = 300/0.36397 = 824 ft.',
  formula:'R = T/tan(\u0394/2)' },
{ id:'f-pt-9', track:'pe-transpo', topic:'pt-vert', diff:3,
  stem:'A vertical curve has L = 400 ft and A = 5%. What is the maximum offset (middle ordinate) at the curve midpoint?',
  choices:['1.25 ft','2.50 ft','3.75 ft','5.00 ft'], answer:1,
  solution:'Mid-curve offset = AL/800 = 5(400)/800 = 2.5 ft.\nUsing y = Ax\u00B2/(200L) at x = L/2 = 200:\ny = 5(200)\u00B2/(200 \u00D7 400) = 200,000/80,000 = 2.5 ft. \u2713',
  formula:'y_mid = AL/800' },
{ id:'f-pt-10', track:'pe-transpo', topic:'pt-drain', diff:3,
  stem:'A grate inlet on grade intercepts 4 cfs of a 5-cfs gutter flow. What is the bypass (carryover) flow?',
  choices:['0.5 cfs','1.0 cfs','1.5 cfs','4.0 cfs'], answer:1,
  solution:'Bypass = total \u2212 intercepted = 5 \u2212 4 = 1.0 cfs.\nThis carryover must be added to the flow reaching the next downstream inlet.',
  formula:'Q_bypass = Q_total \u2212 Q_intercepted' },
{ id:'f-pt-11', track:'pe-transpo', topic:'pt-traffic', diff:3,
  stem:'A 2-mile segment has an average travel time of 4 minutes. What is the space mean speed?',
  choices:['20 mph','30 mph','40 mph','50 mph'], answer:1,
  solution:'v = d/t = 2 mi/(4/60 hr) = 2/0.0667 = 30 mph.',
  formula:'v = distance/time' },
{ id:'f-pt-12', track:'pe-transpo', topic:'pt-signal', diff:3,
  stem:'An intersection approach has a 60-s cycle, 24-s effective green, and arrival rate 500 vph. What is the approach delay per vehicle by uniform delay?',
  choices:['9.0 s','12.9 s','18.0 s','21.6 s'], answer:2,
  solution:'d = 0.5C(1 \u2212 g/C)\u00B2/(1 \u2212 (g/C)X)\ng/C = 24/60 = 0.40, and take X = 0.40\nNumerator = 0.5(60)(0.60)\u00B2 = 30(0.36) = 10.8\nDenominator = 1 \u2212 (0.40)(0.40) = 0.84\nd = 10.8/0.84 = 12.9 s per vehicle.',
  formula:'d = 0.5C(1\u2212g/C)\u00B2/(1\u2212(g/C)X)' },

/* ---------- PE WRE ---------- */
{ id:'f-pw-1', track:'pe-wre', topic:'pw-plan', diff:2,
  stem:'A pipeline costs $2.4M to build with $60,000/yr O&M and a 40-year life. At 5%, what is the equivalent uniform annual cost?',
  choices:['$120,000','$140,000','$200,000','$260,000'], answer:2,
  solution:'(A/P, 5%, 40) = 0.05828\nAnnualized capital = 2,400,000(0.05828) = $139,900\nEUAC = 139,900 + 60,000 = $199,900 \u2248 $200,000.',
  formula:'EUAC = P(A/P,i,n) + A_operating' },
{ id:'f-pw-2', track:'pe-wre', topic:'pw-plan', diff:2,
  stem:'A Section 404 permit under the Clean Water Act is required for:',
  choices:['Any construction project','Discharge of dredged or fill material into waters of the United States','All stormwater discharges','Drinking water treatment plants'], answer:1,
  solution:'Section 404, administered by the U.S. Army Corps of Engineers, regulates the discharge of dredged or fill material into waters of the United States, including wetlands. Stormwater discharges fall under the Section 402 NPDES program.' },
{ id:'f-pw-3', track:'pe-wre', topic:'pw-plan', diff:2,
  stem:'A project has a 30-year design life but the pumps last 15 years. In a life-cycle cost analysis you should:',
  choices:['Ignore pump replacement','Include a pump replacement cost at year 15','Use a 15-year analysis period','Double the initial pump cost'], answer:1,
  solution:'Life-cycle cost analysis must capture every cash flow across the analysis period, including a mid-life pump replacement at year 15 (discounted to present worth) and any salvage value at year 30.' },
{ id:'f-pw-4', track:'pe-wre', topic:'pw-soil', diff:2,
  stem:'A pipe trench is backfilled and must reach 95% standard Proctor. Testing shows 92%. The correct action is:',
  choices:['Accept it \u2014 close enough','Rework: scarify, adjust moisture, and recompact','Add more fill on top','Reduce the specification'], answer:1,
  solution:'Under-compacted backfill leads to surface settlement and pipe distress. The remedy is to scarify the lift, adjust moisture toward optimum, and recompact until the specified density is verified by retest.' },
{ id:'f-pw-5', track:'pe-wre', topic:'pw-soil', diff:3,
  stem:'A buried pipe has 8 ft of cover in soil weighing 120 pcf. What is the approximate vertical soil pressure on the pipe?',
  choices:['480 psf','720 psf','960 psf','1,200 psf'], answer:2,
  solution:'p = \u03B3H = 120(8) = 960 psf.\nMarston\u2019s theory refines this for trench versus embankment conditions, but the prism load is the starting point.',
  formula:'p = \u03B3H' },
{ id:'f-pw-6', track:'pe-wre', topic:'pw-soil', diff:2,
  stem:'A soil with a high shrink-swell potential is most likely classified as:',
  choices:['SW','GP','CH','SP'], answer:2,
  solution:'CH is a fat clay of high plasticity. High-plasticity clays contain expansive minerals such as montmorillonite and exhibit large volume change with moisture. SW, SP, and GP are granular and essentially non-expansive.' },
{ id:'f-pw-7', track:'pe-wre', topic:'pw-mat', diff:2,
  stem:'PVC pipe compared with ductile iron pipe generally has:',
  choices:['Higher stiffness and higher corrosion resistance','Lower stiffness and higher corrosion resistance','Higher stiffness and lower corrosion resistance','Identical properties'], answer:1,
  solution:'PVC is a flexible pipe with much lower stiffness, so it relies on soil support for its shape, but it is immune to the galvanic and microbial corrosion that affects ductile iron.' },
{ id:'f-pw-8', track:'pe-wre', topic:'pw-mat', diff:3,
  stem:'A concrete pipe is exposed to sulfate-rich soil. The best mitigation is:',
  choices:['Increase the water-cement ratio','Use Type V sulfate-resisting cement and a low w/c','Use Type III cement','Add air entrainment only'], answer:1,
  solution:'Type V cement has low tricalcium aluminate (C\u2083A) content, the compound attacked by sulfates. Pair it with a low water-cement ratio to reduce permeability. Raising w/c would make the attack worse.' },
{ id:'f-pw-9', track:'pe-wre', topic:'pw-mat', diff:2,
  stem:'Cement-mortar lining inside a ductile iron water main primarily:',
  choices:['Increases pipe strength','Protects against internal corrosion and maintains a smooth C-factor','Provides thermal insulation','Prevents external corrosion'], answer:1,
  solution:'The cement-mortar lining passivates the interior surface, preventing tuberculation and internal corrosion. That preserves the Hazen-Williams C factor over the life of the main.' },
{ id:'f-pw-10', track:'pe-wre', topic:'pw-gw', diff:3,
  stem:'An unconfined aquifer well pumps with h\u2081 = 40 ft at r\u2081 = 50 ft and h\u2082 = 46 ft at r\u2082 = 300 ft, k = 30 ft/day. What is Q?',
  choices:['13,600 ft\u00B3/day','19,400 ft\u00B3/day','27,100 ft\u00B3/day','34,800 ft\u00B3/day'], answer:2,
  solution:'Q = \u03C0k(h\u2082\u00B2 \u2212 h\u2081\u00B2)/ln(r\u2082/r\u2081)\n= \u03C0(30)(46\u00B2 \u2212 40\u00B2)/ln(6)\n= \u03C0(30)(2,116 \u2212 1,600)/1.7918\n= \u03C0(30)(516)/1.7918\n= 48,632/1.7918 = 27,100 ft\u00B3/day.',
  formula:'Q = \u03C0k(h\u2082\u00B2\u2212h\u2081\u00B2)/ln(r\u2082/r\u2081)' },
{ id:'f-pw-11', track:'pe-wre', topic:'pw-gw', diff:2,
  stem:'A confined aquifer is characterized by:',
  choices:['A free water surface at atmospheric pressure','Being bounded above and below by low-permeability layers, with water under pressure','Always being unsaturated','Having no recharge area'], answer:1,
  solution:'A confined (artesian) aquifer is sandwiched between aquitards, so the water is under pressure greater than atmospheric. The potentiometric surface rises above the top of the aquifer when a well is drilled.' },
{ id:'f-pw-12', track:'pe-wre', topic:'pw-quality', diff:3,
  stem:'A lake shows rapid algal growth and oxygen depletion. The most likely cause is:',
  choices:['Excess nutrient loading (nitrogen and phosphorus)','Low water temperature','High dissolved oxygen','Excess chlorination'], answer:0,
  solution:'Nutrient enrichment (eutrophication), usually phosphorus-limited in freshwater, drives algal blooms. When the algae die, decomposition consumes dissolved oxygen and can cause fish kills.' },
{ id:'f-pw-13', track:'pe-wre', topic:'pw-quality', diff:3,
  stem:'A TMDL establishes:',
  choices:['A construction schedule','The maximum pollutant load a water body can receive and still meet standards','A minimum treatment plant size','A drinking water contaminant limit'], answer:1,
  solution:'A Total Maximum Daily Load is the calculated maximum amount of a pollutant a water body can receive and still meet water quality standards. It allocates that load among point sources (WLA) and nonpoint sources (LA) with a margin of safety.' },
{ id:'f-pw-14', track:'pe-wre', topic:'pw-econ', diff:2,
  stem:'A $150,000 investment saves $25,000 per year. What is the simple payback period?',
  choices:['4 years','6 years','8 years','10 years'], answer:1,
  solution:'Payback = 150,000/25,000 = 6 years.\nSimple payback ignores the time value of money; discounted payback would be longer.',
  formula:'Payback = investment / annual savings' },
{ id:'f-pw-15', track:'pe-wre', topic:'pw-econ', diff:3,
  stem:'A project has a benefit-cost ratio of 0.85. This means:',
  choices:['Benefits exceed costs; build it','Costs exceed benefits; not economically justified','The project breaks even','The discount rate is too low'], answer:1,
  solution:'B/C < 1.0 means the present worth of benefits is less than the present worth of costs, so the project is not economically justified on that basis alone. Non-monetized benefits may still warrant consideration.' },
{ id:'f-pw-16', track:'pe-wre', topic:'pw-site', diff:2,
  stem:'A temporary construction entrance of coarse stone is installed primarily to:',
  choices:['Support heavy loads','Reduce sediment tracked onto public roads','Provide drainage','Mark the property line'], answer:1,
  solution:'A stabilized construction entrance uses coarse aggregate to dislodge mud from tires before vehicles reach paved public roads, which is a standard SWPPP sediment control measure.' },
{ id:'f-pw-17', track:'pe-wre', topic:'pw-drinking', diff:3,
  stem:'A flocculation basin has a velocity gradient G = 40 s\u207B\u00B9 and detention time 20 min. What is the dimensionless Gt value?',
  choices:['800','12,000','48,000','96,000'], answer:2,
  solution:'t = 20 min = 1,200 s\nGt = 40(1,200) = 48,000.\nTypical flocculation design targets Gt between 30,000 and 100,000.',
  formula:'Gt = G \u00D7 t' },
{ id:'f-pw-18', track:'pe-wre', topic:'pw-wastewater', diff:3,
  stem:'A sewer must carry 2 cfs at a minimum self-cleansing velocity of 2 fps. What is the minimum flow area?',
  choices:['0.5 ft\u00B2','1.0 ft\u00B2','2.0 ft\u00B2','4.0 ft\u00B2'], answer:1,
  solution:'A = Q/V = 2/2 = 1.0 ft\u00B2.\nSanitary sewers are designed for a minimum of 2 fps at design flow to prevent solids deposition.',
  formula:'A = Q/V' },

/* ---------- PE CONSTRUCTION ---------- */
{ id:'f-pc-1', track:'pe-construction', topic:'pc-soil', diff:3,
  stem:'A braced excavation 24 ft deep in sand with \u03B3 = 120 pcf and \u03D5 = 32\u00B0 uses an apparent earth pressure diagram with p = 0.65K_a\u03B3H. What is p?',
  choices:['575 psf','884 psf','1,360 psf','2,300 psf'], answer:0,
  solution:'K_a = tan\u00B2(45 \u2212 16) = tan\u00B2(29\u00B0) = 0.307\nK_a\u03B3H = 0.307(120)(24) = 884 psf\np = 0.65(884) = 575 psf.\nThis is the Terzaghi-Peck rectangular apparent pressure diagram for braced cuts in sand.',
  formula:'p = 0.65K_a\u03B3H (sand, braced cut)' },
{ id:'f-pc-2', track:'pe-construction', topic:'pc-soil', diff:2,
  stem:'A saturated clay is loaded rapidly during construction. The appropriate strength parameter is:',
  choices:['Drained \u03D5\u2032 with c\u2032 = 0','Undrained shear strength c_u with \u03D5 = 0','Residual strength','Peak dilatancy angle'], answer:1,
  solution:'Rapid loading of saturated clay is an undrained (short-term) condition. Total stress analysis with c_u and \u03D5 = 0 applies. Long-term stability uses effective stress parameters c\u2032 and \u03D5\u2032.' },
{ id:'f-pc-3', track:'pe-construction', topic:'pc-soil', diff:3,
  stem:'A 6-ft embankment (\u03B3 = 125 pcf) is placed over clay. What is the stress increase at the clay surface?',
  choices:['500 psf','625 psf','750 psf','900 psf'], answer:2,
  solution:'\u0394\u03C3 = \u03B3H = 125(6) = 750 psf.\nThis increment drives the consolidation settlement calculation for the underlying clay.',
  formula:'\u0394\u03C3 = \u03B3H' },
{ id:'f-pc-4', track:'pe-construction', topic:'pc-layout', diff:2,
  stem:'A total station measures a slope distance of 200.00 ft at a vertical angle of 5\u00B0. What is the horizontal distance?',
  choices:['198.48 ft','199.24 ft','200.00 ft','200.76 ft'], answer:1,
  solution:'H = S cos\u03B8 = 200.00 cos5\u00B0 = 200.00(0.99619) = 199.24 ft.',
  formula:'H = S cos\u03B8' },
{ id:'f-pc-5', track:'pe-construction', topic:'pc-layout', diff:2,
  stem:'A site benchmark should be:',
  choices:['Placed inside the excavation footprint','Established outside the construction zone on a stable, protected object','Moved as construction progresses','Marked only on the drawings'], answer:1,
  solution:'Benchmarks must remain undisturbed for the project duration, so they are set outside the work area on stable features and protected. A benchmark inside the excavation would be destroyed early.' },
{ id:'f-pc-6', track:'pe-construction', topic:'pc-layout', diff:3,
  stem:'A building is staked with a 3-4-5 triangle to establish a right angle. Using 30 ft along one leg, the other leg and hypotenuse should be:',
  choices:['40 ft and 50 ft','35 ft and 45 ft','40 ft and 45 ft','45 ft and 55 ft'], answer:0,
  solution:'The 3-4-5 ratio scaled by 10 gives 30-40-50. With legs of 30 ft and 40 ft, the hypotenuse must measure exactly 50 ft to confirm a 90\u00B0 corner.',
  formula:'a\u00B2 + b\u00B2 = c\u00B2' },
{ id:'f-pc-7', track:'pe-construction', topic:'pc-struct', diff:3,
  stem:'A W12\u00D726 beam (S\u2093 = 33.4 in\u00B3) is used as a temporary spreader with a 45 kip-in moment. What is the bending stress?',
  choices:['0.74 ksi','1.35 ksi','2.70 ksi','13.5 ksi'], answer:1,
  solution:'\u03C3 = M/S = 45/33.4 = 1.35 ksi.\nThis is far below F_y, so the section is lightly stressed in bending.',
  formula:'\u03C3 = M/S' },
{ id:'f-pc-8', track:'pe-construction', topic:'pc-struct', diff:3,
  stem:'A temporary guy cable is at 60\u00B0 from horizontal and must resist a 5-kip horizontal force. What is the cable tension?',
  choices:['5.0 kip','5.8 kip','8.7 kip','10.0 kip'], answer:3,
  solution:'The horizontal component is T cos60\u00B0.\nT = 5/cos60\u00B0 = 5/0.5 = 10.0 kip.',
  formula:'T = F_horizontal/cos\u03B8' },
{ id:'f-pc-9', track:'pe-construction', topic:'pc-earth', diff:3,
  stem:'A haul road is 1.2 miles long and trucks average 20 mph loaded and 30 mph empty. What is the round-trip travel time?',
  choices:['4.0 min','6.0 min','8.0 min','10.0 min'], answer:1,
  solution:'Loaded: 1.2/20 = 0.06 hr = 3.6 min\nEmpty: 1.2/30 = 0.04 hr = 2.4 min\nTotal = 6.0 min (excluding load, dump, and spot times).',
  formula:'t = d/v' },
{ id:'f-pc-10', track:'pe-construction', topic:'pc-ops', diff:2,
  stem:'Concrete is placed by pump at 40 cy/hr. How long to place 180 cy?',
  choices:['3.5 hours','4.5 hours','5.0 hours','6.0 hours'], answer:1,
  solution:'t = 180/40 = 4.5 hours.',
  formula:'t = V/rate' },
{ id:'f-pc-11', track:'pe-construction', topic:'pc-safety', diff:2,
  stem:'Under OSHA, scaffolds must be designed to support their own weight plus what multiple of the maximum intended load?',
  choices:['2 times','4 times','6 times','10 times'], answer:1,
  solution:'OSHA 29 CFR 1926.451 requires each scaffold and scaffold component to support its own weight and at least 4 times the maximum intended load. Suspension ropes require a safety factor of 6.' },
{ id:'f-pc-12', track:'pe-construction', topic:'pc-temp', diff:3,
  stem:'Formwork must be cambered when:',
  choices:['Never \u2014 forms are always built level','Anticipated deflection would leave the finished member out of tolerance','Only for vertical walls','Only in cold weather'], answer:1,
  solution:'Camber is built into forms to offset anticipated deflection of the formwork and the member itself under wet concrete load, so the hardened element finishes at the intended profile.' },
{ id:'f-pc-13', track:'pe-construction', topic:'pc-qc', diff:2,
  stem:'A nondestructive method to verify weld quality below the surface is:',
  choices:['Visual inspection','Ultrasonic testing','Slump test','Rebound hammer'], answer:1,
  solution:'Ultrasonic testing (UT) detects subsurface discontinuities in welds. Visual inspection catches only surface defects; the slump and rebound hammer tests apply to concrete.' },
{ id:'f-pc-14', track:'pe-construction', topic:'pc-est', diff:3,
  stem:'A masonry wall is 200 ft long and 10 ft high using 6.75 blocks per square foot. How many blocks are needed with 5% waste?',
  choices:['13,500 blocks','14,175 blocks','15,000 blocks','16,200 blocks'], answer:1,
  solution:'Area = 200(10) = 2,000 ft\u00B2\nBlocks = 2,000(6.75) = 13,500\nWith 5% waste: 13,500(1.05) = 14,175 blocks.',
  formula:'Qty = area \u00D7 unit rate \u00D7 (1 + waste)' }
];

  formula:'p = K_a\u03B3H' },
{ id:'s2-6', track:'pe-structural', topic:'ps-loads', diff:3,
  stem:'A structure with W = 4,000 kip has S_DS = 0.85, R = 6, I_e = 1.25. What is the seismic base shear?',
  choices:['425 kip','567 kip','708 kip','850 kip'], answer:2,
  solution:'C\u209B = S_DS/(R/I_e) = 0.85/(6/1.25) = 0.85/4.8 = 0.1771\nV = C\u209BW = 0.1771(4,000) = 708 kip.',
  formula:'C\u209B = S_DS/(R/I_e)' },
{ id:'s2-7', track:'pe-structural', topic:'ps-loads', diff:2,
  stem:'A girder spans 40 ft with a 20-ft tributary width carrying 120 psf. What is the total load on the girder?',
  choices:['48 kip','72 kip','96 kip','120 kip'], answer:2,
  solution:'w = 20(120) = 2,400 plf = 2.4 klf\nW = 2.4(40) = 96 kip.',
  formula:'W = w_area \u00D7 trib \u00D7 span' },
{ id:'s2-8', track:'pe-structural', topic:'ps-loads', diff:3,
  stem:'Under ASCE 7 the load combination 0.9D + 1.0W is checked primarily to detect:',
  choices:['Maximum downward force','Net uplift or overturning','Serviceability deflection','Fatigue'], answer:1,
  solution:'The 0.9 factor minimizes the stabilizing dead load so that wind uplift, overturning, and net tension in anchors and foundations are captured. Using 1.2D would mask uplift.' },
{ id:'s2-9', track:'pe-structural', topic:'ps-loads', diff:3,
  stem:'A column supports 4 floors, each with a 500-ft\u00B2 tributary area, L\u2080 = 50 psf, K_LL = 4. What is K_LL A_T?',
  choices:['2,000 ft\u00B2','4,000 ft\u00B2','8,000 ft\u00B2','10,000 ft\u00B2'], answer:2,
  solution:'A_T = 4 floors \u00D7 500 = 2,000 ft\u00B2\nK_LL A_T = 4(2,000) = 8,000 ft\u00B2.\nWell above 400 ft\u00B2, so live load reduction applies.',
  formula:'K_LL A_T' },
{ id:'s2-10', track:'pe-structural', topic:'ps-loads', diff:2,
  stem:'Rain load ponding instability is most likely when:',
  choices:['The roof is steeply sloped','The roof is nearly flat with inadequate drainage and a flexible structure','The roof has a parapet with many scuppers','Snow load governs'], answer:1,
  solution:'Ponding is a progressive instability: water deflects a flexible near-flat roof, which holds more water, which deflects it further. Adequate slope, drains, and secondary overflow scuppers prevent it.' },

/* ---------- Forces & Load Effects ---------- */
{ id:'s2-11', track:'pe-structural', topic:'ps-forces', diff:2,
  stem:'A simply supported beam spans 36 ft with w = 2.5 kip/ft. What is the end reaction?',
  choices:['30 kip','45 kip','60 kip','90 kip'], answer:1,
  solution:'R = wL/2 = 2.5(36)/2 = 45 kip.',
  formula:'R = wL/2' },
{ id:'s2-12', track:'pe-structural', topic:'ps-forces', diff:3,
  stem:'A cantilever 8 ft long carries w = 3 kip/ft plus a 10-kip tip load. What is the fixed-end moment?',
  choices:['96 kip-ft','156 kip-ft','176 kip-ft','200 kip-ft'], answer:2,
  solution:'UDL: wL\u00B2/2 = 3(64)/2 = 96 kip-ft\nTip load: PL = 10(8) = 80 kip-ft\nTotal = 96 + 80 = 176 kip-ft.',
  formula:'M = wL\u00B2/2 + PL' },
{ id:'s2-13', track:'pe-structural', topic:'ps-forces', diff:3,
  stem:'A simply supported beam has a 20-kip load at 1/4 of a 40-ft span. What is the larger reaction?',
  choices:['5 kip','10 kip','15 kip','20 kip'], answer:2,
  solution:'Load is 10 ft from the left support.\nR_left = P(L\u2212a)/L = 20(30)/40 = 15 kip\nR_right = 20 \u2212 15 = 5 kip.',
  formula:'R = P(L\u2212a)/L' },
{ id:'s2-14', track:'pe-structural', topic:'ps-forces', diff:3,
  stem:'A fixed-fixed beam spans 24 ft with w = 4 kip/ft. What is the magnitude of the end moment?',
  choices:['96 kip-ft','144 kip-ft','192 kip-ft','288 kip-ft'], answer:2,
  solution:'M_end = wL\u00B2/12 = 4(576)/12 = 192 kip-ft.',
  formula:'M_end = wL\u00B2/12' },
{ id:'s2-15', track:'pe-structural', topic:'ps-forces', diff:3,
  stem:'For the same fixed-fixed beam (w = 4 kip/ft, L = 24 ft), what is the midspan moment?',
  choices:['48 kip-ft','96 kip-ft','144 kip-ft','192 kip-ft'], answer:1,
  solution:'M_mid = wL\u00B2/24 = 4(576)/24 = 96 kip-ft.',
  formula:'M_mid = wL\u00B2/24' },
{ id:'s2-16', track:'pe-structural', topic:'ps-forces', diff:3,
  stem:'A truss joint has three members meeting with no external load, and two are collinear. The third member force is:',
  choices:['Equal to the collinear members','Zero','Twice the collinear force','Indeterminate'], answer:1,
  solution:'Zero-force member rule: at an unloaded joint where two members are collinear, the third non-collinear member carries zero force (equilibrium perpendicular to the collinear pair).' },
{ id:'s2-17', track:'pe-structural', topic:'ps-forces', diff:3,
  stem:'A simply supported beam with a central point load P = 30 kip spans 20 ft, E = 29,000 ksi, I = 800 in\u2074. What is the midspan deflection?',
  choices:['0.19 in','0.28 in','0.37 in','0.52 in'], answer:2,
  solution:'\u0394 = PL\u00B3/(48EI)\nL = 20 ft = 240 in ; L\u00B3 = 13,824,000 in\u00B3\n= 30(13,824,000)/[48(29,000)(800)]\n= 414,720,000/1,113,600,000 = 0.37 in.',
  formula:'\u0394 = PL\u00B3/(48EI)' },
{ id:'s2-18', track:'pe-structural', topic:'ps-forces', diff:2,
  stem:'A pinned-pinned column of length L buckles about the axis with:',
  choices:['The largest radius of gyration','The smallest radius of gyration','The largest area','The largest section modulus'], answer:1,
  solution:'Buckling capacity depends on KL/r; the largest slenderness ratio governs, which occurs about the axis with the smallest radius of gyration (usually the weak/y-axis for a W-shape).' },
{ id:'s2-19', track:'pe-structural', topic:'ps-forces', diff:3,
  stem:'A W-shape column has r_x = 6.0 in, r_y = 2.5 in, and is 16 ft tall, pinned both axes. Which slenderness governs and what is its value?',
  choices:['x-axis, 32','y-axis, 32','x-axis, 77','y-axis, 77'], answer:3,
  solution:'KL = 1.0(16)(12) = 192 in\nKL/r_x = 192/6.0 = 32\nKL/r_y = 192/2.5 = 76.8 \u2248 77 \u2190 governs (larger).',
  formula:'KL/r' },
{ id:'s2-20', track:'pe-structural', topic:'ps-forces', diff:3,
  stem:'A three-span continuous beam is analyzed by moment distribution. The distribution factor for a member is proportional to:',
  choices:['Its length','Its stiffness EI/L relative to the joint total','Its applied load','Its depth'], answer:1,
  solution:'DF = (EI/L)_member / \u03A3(EI/L)_at joint. Stiffer members attract a larger share of the unbalanced moment.',
  formula:'DF = k/\u03A3k, k = EI/L' },
{ id:'s2-21', track:'pe-structural', topic:'ps-forces', diff:3,
  stem:'An influence line for reaction at support A of a simple span is used to find the maximum reaction. The load should be placed:',
  choices:['At midspan','Directly over support A','At the far support','Anywhere \u2014 it does not matter'], answer:1,
  solution:'The influence line for R_A is a straight line from 1.0 at A to 0 at B. Maximum ordinate occurs at A, so placing the load directly over support A maximizes that reaction.' },
{ id:'s2-22', track:'pe-structural', topic:'ps-forces', diff:2,
  stem:'A simply supported beam carries a triangular load with peak w\u2080 at one end. What is the total load?',
  choices:['w\u2080L/4','w\u2080L/3','w\u2080L/2','w\u2080L'], answer:2,
  solution:'The area of the triangular distribution is \u00BDw\u2080L, acting at L/3 from the peak end.',
  formula:'W = \u00BDw\u2080L' },
{ id:'s2-23', track:'pe-structural', topic:'ps-forces', diff:3,
  stem:'A rigid frame sways under lateral load. The primary lateral resisting mechanism in a moment frame is:',
  choices:['Axial truss action','Flexural stiffness of beams and columns with rigid joints','Diaphragm friction','Base friction only'], answer:1,
  solution:'Moment frames resist lateral drift through flexure in beams and columns joined by moment-resisting connections. Braced frames use axial truss action instead.' },
{ id:'s2-24', track:'pe-structural', topic:'ps-forces', diff:3,
  stem:'A simple beam of span L carries a UDL. Where is the shear zero, and what does that indicate?',
  choices:['At the supports \u2014 minimum moment','At midspan \u2014 maximum moment','At L/4 \u2014 inflection point','Nowhere'], answer:1,
  solution:'Shear varies linearly from +wL/2 to \u2212wL/2, crossing zero at midspan. Since V = dM/dx, zero shear locates the maximum moment.',
  formula:'V = dM/dx' },

/* ---------- Temporary Structures ---------- */
{ id:'s2-25', track:'pe-structural', topic:'ps-temp', diff:3,
  stem:'A wall form is placed at R = 4 ft/hr and T = 60\u00B0F. Using p = 150 + 9,000R/T, what is the design pressure?',
  choices:['450 psf','600 psf','750 psf','900 psf'], answer:2,
  solution:'p = 150 + 9,000(4)/60 = 150 + 600 = 750 psf.\nCheck against full liquid head \u03B3h and the 2,000 psf wall cap.',
  formula:'p = C_wC_c[150 + 9,000R/T]' },
{ id:'s2-26', track:'pe-structural', topic:'ps-temp', diff:2,
  stem:'Formwork for a 10-ft tall wall filled with fresh concrete (150 pcf) has what maximum possible pressure?',
  choices:['750 psf','1,000 psf','1,500 psf','2,000 psf'], answer:2,
  solution:'Full liquid head is the absolute ceiling:\np = \u03B3h = 150(10) = 1,500 psf.\nACI 347 formulas may give less, but never more than \u03B3h.',
  formula:'p_max = \u03B3h' },
{ id:'s2-27', track:'pe-structural', topic:'ps-temp', diff:3,
  stem:'Shoring posts are spaced 5 ft on center each way under a form carrying 180 psf. What load does each post carry?',
  choices:['3,600 lb','4,500 lb','5,400 lb','9,000 lb'], answer:1,
  solution:'Tributary area = 5(5) = 25 ft\u00B2\nP = 180(25) = 4,500 lb.',
  formula:'P = w \u00D7 A_trib' },
{ id:'s2-28', track:'pe-structural', topic:'ps-temp', diff:2,
  stem:'Falsework differs from formwork in that falsework:',
  choices:['Contains the wet concrete surface','Is the temporary support structure carrying forms and loads to the ground','Is permanent','Is only used for walls'], answer:1,
  solution:'Formwork is the mold that shapes the concrete; falsework is the temporary supporting structure (shores, towers, bracing) that carries the forms and construction loads down to a foundation.' },
{ id:'s2-29', track:'pe-structural', topic:'ps-temp', diff:3,
  stem:'A temporary guy wire resists a 12-kip horizontal force at 40\u00B0 from horizontal. What is the wire tension?',
  choices:['7.7 kip','12.0 kip','15.7 kip','18.7 kip'], answer:2,
  solution:'T cos40\u00B0 = 12\nT = 12/0.766 = 15.7 kip.',
  formula:'T = H/cos\u03B8' },
{ id:'s2-30', track:'pe-structural', topic:'ps-temp', diff:2,
  stem:'Before removing shores from a concrete slab, the primary check is:',
  choices:['Form cleanliness','That in-place concrete strength is adequate for the loads at that time','That the weather is dry','That the crew is available'], answer:1,
  solution:'Shore removal is governed by verified in-place strength (field-cured cylinders or maturity), not by elapsed time, because the young slab must carry its own weight plus construction loads.' },

/* ---------- Materials ---------- */
{ id:'s2-31', track:'pe-structural', topic:'ps-materials', diff:2,
  stem:'What is \u03B2\u2081 for concrete with f\u2032c = 3,000 psi?',
  choices:['0.65','0.75','0.80','0.85'], answer:3,
  solution:'\u03B2\u2081 = 0.85 for f\u2032c \u2264 4,000 psi. Reduction begins only above 4,000 psi.',
  formula:'\u03B2\u2081 = 0.85 (f\u2032c \u2264 4 ksi)' },
{ id:'s2-32', track:'pe-structural', topic:'ps-materials', diff:3,
  stem:'For f\u2032c = 8,000 psi, what is \u03B2\u2081?',
  choices:['0.85','0.75','0.65','0.55'], answer:2,
  solution:'\u03B2\u2081 = 0.85 \u2212 0.05(8,000\u22124,000)/1,000 = 0.85 \u2212 0.20 = 0.65\nThe floor value is 0.65, so \u03B2\u2081 = 0.65.',
  formula:'\u03B2\u2081 \u2265 0.65' },
{ id:'s2-33', track:'pe-structural', topic:'ps-materials', diff:2,
  stem:'ASTM A36 steel has what specified minimum yield and tensile strength?',
  choices:['36 ksi / 58 ksi','36 ksi / 65 ksi','50 ksi / 65 ksi','42 ksi / 60 ksi'], answer:0,
  solution:'A36: F_y = 36 ksi, F_u = 58 ksi (58\u201380 ksi range). A992 is 50/65.' },
{ id:'s2-34', track:'pe-structural', topic:'ps-materials', diff:3,
  stem:'The modular ratio n for f\u2032c = 4,000 psi normalweight concrete is most nearly:',
  choices:['5','8','12','15'], answer:1,
  solution:'E_c = 57,000\u221A4,000 = 3,605,000 psi\nn = E_s/E_c = 29,000,000/3,605,000 = 8.04 \u2248 8.',
  formula:'n = E_s/E_c' },
{ id:'s2-35', track:'pe-structural', topic:'ps-materials', diff:2,
  stem:'Southern Pine and Douglas Fir-Larch reference design values are adjusted by C_M when:',
  choices:['Temperature exceeds 100\u00B0F','Moisture content exceeds 19% (wet service)','The member is a column','Load duration is short'], answer:1,
  solution:'C_M is the wet service factor, applied when the in-service moisture content of sawn lumber exceeds 19%. C_t handles temperature and C_D handles load duration.' },
{ id:'s2-36', track:'pe-structural', topic:'ps-materials', diff:3,
  stem:'A concrete has f\u2032c = 4,000 psi and is lightweight with \u03BB = 0.75. What is the modulus of rupture?',
  choices:['356 psi','398 psi','474 psi','632 psi'], answer:0,
  solution:'f_r = 7.5\u03BB\u221Af\u2032c = 7.5(0.75)(63.25) = 355.8 \u2248 356 psi.',
  formula:'f_r = 7.5\u03BB\u221Af\u2032c' },
{ id:'s2-37', track:'pe-structural', topic:'ps-materials', diff:2,
  stem:'Grade 270 prestressing strand has an ultimate tensile strength of:',
  choices:['60 ksi','150 ksi','270 ksi','400 ksi'], answer:2,
  solution:'The grade designation is the ultimate strength in ksi: Grade 270 strand has f_pu = 270 ksi, far above ordinary Grade 60 reinforcing bar.' },
{ id:'s2-38', track:'pe-structural', topic:'ps-materials', diff:3,
  stem:'Masonry compressive strength f\u2032m for typical concrete block with Type S mortar is commonly taken as:',
  choices:['500 psi','1,500 psi','4,000 psi','6,000 psi'], answer:1,
  solution:'Design values for ordinary CMU construction commonly use f\u2032m = 1,500 to 2,000 psi, established either by the unit strength method or by prism testing.' },

/* ---------- Component Design & Detailing ---------- */
{ id:'s2-39', track:'pe-structural', topic:'ps-components', diff:3,
  stem:'A W21\u00D744 has Z\u2093 = 95.4 in\u00B3, F_y = 50 ksi, compact and fully braced. What is \u03D5_bM_n in kip-ft?',
  choices:['298 kip-ft','358 kip-ft','398 kip-ft','438 kip-ft'], answer:1,
  solution:'M_p = 50(95.4) = 4,770 kip-in\n\u03D5_bM_n = 0.90(4,770) = 4,293 kip-in\n= 4,293/12 = 358 kip-ft.',
  formula:'\u03D5_bM_n = 0.9F_yZ\u2093' },
{ id:'s2-40', track:'pe-structural', topic:'ps-components', diff:3,
  stem:'A beam must resist M_u = 300 kip-ft with F_y = 50 ksi. What is the minimum required Z\u2093?',
  choices:['60 in\u00B3','72 in\u00B3','80 in\u00B3','96 in\u00B3'], answer:2,
  solution:'Z_req = M_u/(\u03D5_bF_y) = 300(12)/[0.90(50)]\n= 3,600/45 = 80 in\u00B3.',
  formula:'Z_req = M_u/(\u03D5F_y)' },
{ id:'s2-41', track:'pe-structural', topic:'ps-components', diff:3,
  stem:'A singly reinforced beam has b = 14 in, d = 22 in, A\u209B = 4.0 in\u00B2, f\u2032c = 5 ksi, f_y = 60 ksi. What is the depth of the equivalent stress block a?',
  choices:['3.36 in','4.03 in','4.71 in','5.04 in'], answer:1,
  solution:'a = A\u209Bf_y/(0.85f\u2032c b)\n= 4.0(60)/[0.85(5)(14)]\n= 240/59.5 = 4.03 in.',
  formula:'a = A\u209Bf_y/(0.85f\u2032c b)' },
{ id:'s2-42', track:'pe-structural', topic:'ps-components', diff:3,
  stem:'A rectangular beam has b = 12 in, d = 18 in, and requires A\u209B such that \u03C1 = 0.01. What is A\u209B?',
  choices:['1.62 in\u00B2','2.16 in\u00B2','2.70 in\u00B2','3.24 in\u00B2'], answer:1,
  solution:'A\u209B = \u03C1bd = 0.01(12)(18) = 2.16 in\u00B2.',
  formula:'A\u209B = \u03C1bd' },
{ id:'s2-43', track:'pe-structural', topic:'ps-components', diff:3,
  stem:'A concrete beam has b_w = 12 in, d = 20 in, f\u2032c = 5,000 psi. What is V_c?',
  choices:['28.3 kip','33.9 kip','42.4 kip','50.9 kip'], answer:1,
  solution:'V_c = 2\u03BB\u221Af\u2032c b_wd = 2(1.0)(70.71)(12)(20)\n= 33,941 lb = 33.9 kip.',
  formula:'V_c = 2\u03BB\u221Af\u2032c b_wd' },
{ id:'s2-44', track:'pe-structural', topic:'ps-components', diff:3,
  stem:'Stirrups of #3 double-leg (A_v = 0.22 in\u00B2) with f_yt = 60 ksi at s = 10 in in a beam with d = 20 in provide what V_s?',
  choices:['13.2 kip','26.4 kip','33.0 kip','44.0 kip'], answer:1,
  solution:'V_s = A_vf_ytd/s = 0.22(60)(20)/10\n= 264/10 = 26.4 kip.',
  formula:'V_s = A_vf_ytd/s' },
{ id:'s2-45', track:'pe-structural', topic:'ps-components', diff:2,
  stem:'ACI maximum stirrup spacing for a beam with d = 24 in when V_s is small is:',
  choices:['6 in','12 in','24 in','36 in'], answer:1,
  solution:'Maximum spacing is the lesser of d/2 and 24 in.\nd/2 = 12 in \u2190 governs.',
  formula:'s_max = min(d/2, 24 in)' },
{ id:'s2-46', track:'pe-structural', topic:'ps-components', diff:3,
  stem:'A \u215E-in A325-X bolt (threads excluded, F_nv = 68 ksi) in single shear has what \u03D5R_n?',
  choices:['21.9 kip','30.7 kip','35.1 kip','43.8 kip'], answer:1,
  solution:'A_b = \u03C0(0.875)\u00B2/4 = 0.6013 in\u00B2\nR_n = 68(0.6013) = 40.9 kip\n\u03D5R_n = 0.75(40.9) = 30.7 kip.',
  formula:'\u03D5R_n = 0.75F_nvA_b' },
{ id:'s2-47', track:'pe-structural', topic:'ps-components', diff:3,
  stem:'A connection carries 100 kip in single shear using \u00BE-in A325-N bolts (\u03D5r_n = 17.9 kip each). What is the minimum number of bolts?',
  choices:['4','5','6','8'], answer:2,
  solution:'n = P_u/\u03D5r_n = 100/17.9 = 5.6\nRound up to a whole bolt: 6 bolts.',
  formula:'n = P_u/\u03D5r_n' },
{ id:'s2-48', track:'pe-structural', topic:'ps-components', diff:3,
  stem:'A \u00BC-in fillet weld (E70XX) carries load along a 10-in length in LRFD. What is the design strength?',
  choices:['27.8 kip','41.8 kip','55.7 kip','69.6 kip'], answer:2,
  solution:'\u00BC in = 4 sixteenths\nStrength = 4(1.392) = 5.568 kip/in\nTotal = 5.568(10) = 55.7 kip.',
  formula:'1.392 kip/in per sixteenth (LRFD)' },
{ id:'s2-49', track:'pe-structural', topic:'ps-components', diff:3,
  stem:'A tension member has A_g = 6.0 in\u00B2, A_e = 5.1 in\u00B2, F_y = 50 ksi, F_u = 65 ksi. Which limit state governs?',
  choices:['Yielding, 270 kip','Rupture, 249 kip','Yielding, 300 kip','Rupture, 331 kip'], answer:1,
  solution:'Yielding: \u03D5P_n = 0.90(50)(6.0) = 270 kip\nRupture: \u03D5P_n = 0.75(65)(5.1) = 248.6 kip \u2190 governs (smaller)',
  formula:'min(0.9F_yA_g, 0.75F_uA_e)' },
{ id:'s2-50', track:'pe-structural', topic:'ps-components', diff:3,
  stem:'A square footing 8 ft \u00D7 8 ft carries a factored load of 240 kip. What is the factored soil pressure for design?',
  choices:['2.50 ksf','3.00 ksf','3.75 ksf','4.00 ksf'], answer:2,
  solution:'q_u = P_u/A = 240/64 = 3.75 ksf.',
  formula:'q_u = P_u/A' },
{ id:'s2-51', track:'pe-structural', topic:'ps-components', diff:3,
  stem:'Two-way (punching) shear in a footing is checked on a critical perimeter located at what distance from the column face?',
  choices:['d','d/2','2d','d/4'], answer:1,
  solution:'ACI 318 places the critical section for two-way shear at d/2 from the face of the column, forming a perimeter b\u2080 around the column. One-way shear is checked at d.',
  formula:'critical perimeter at d/2' },
{ id:'s2-52', track:'pe-structural', topic:'ps-components', diff:3,
  stem:'A No. 6 bar has what nominal diameter and area?',
  choices:['0.625 in, 0.31 in\u00B2','0.750 in, 0.44 in\u00B2','0.875 in, 0.60 in\u00B2','1.000 in, 0.79 in\u00B2'], answer:1,
  solution:'Bar number = eighths of an inch. No. 6 = 6/8 = 0.750 in diameter.\nA = \u03C0(0.75)\u00B2/4 = 0.442 \u2248 0.44 in\u00B2.',
  formula:'d_b = n/8 in' },
{ id:'s2-53', track:'pe-structural', topic:'ps-components', diff:2,
  stem:'A Class B tension lap splice length is:',
  choices:['1.0\u2113_d','1.3\u2113_d','1.5\u2113_d','2.0\u2113_d'], answer:1,
  solution:'ACI 318: Class A splice = 1.0\u2113_d (used when A\u209B provided is at least twice required and no more than half the bars are spliced); otherwise Class B = 1.3\u2113_d, with a 12-in minimum.',
  formula:'Class B = 1.3\u2113_d \u2265 12 in' },
{ id:'s2-54', track:'pe-structural', topic:'ps-components', diff:3,
  stem:'A wood beam 3.5 in \u00D7 11.25 in has what section modulus about the strong axis?',
  choices:['48.2 in\u00B3','73.8 in\u00B3','92.3 in\u00B3','110.4 in\u00B3'], answer:1,
  solution:'S = bh\u00B2/6 = 3.5(11.25)\u00B2/6\n= 3.5(126.56)/6 = 442.97/6 = 73.8 in\u00B3.',
  formula:'S = bh\u00B2/6' },
{ id:'s2-55', track:'pe-structural', topic:'ps-components', diff:3,
  stem:'A prestressed beam has P_e = 400 kip applied at e = 8 in on a section with A = 500 in\u00B2 and S = 4,000 in\u00B3. What is the bottom fiber stress from prestress alone?',
  choices:['0.80 ksi compression','1.60 ksi compression','2.40 ksi compression','0.80 ksi tension'], answer:1,
  solution:'f = P/A + Pe/S = 400/500 + 400(8)/4,000\n= 0.80 + 0.80 = 1.60 ksi compression at the bottom.',
  formula:'f = P/A \u00B1 Pe/S' },
{ id:'s2-56', track:'pe-structural', topic:'ps-components', diff:2,
  stem:'A masonry wall is designed with fully grouted cells primarily to:',
  choices:['Reduce weight','Increase compressive and shear capacity and bond the reinforcement','Improve appearance','Speed construction'], answer:1,

{ id:'s2-57', track:'pe-structural', topic:'ps-components', diff:3,

{ id:'s2-58', track:'pe-structural', topic:'ps-components', diff:3,

{ id:'s2-59', track:'pe-structural', topic:'ps-components', diff:3,

{ id:'g2-7', track:'pe-geotech', topic:'pg-soil', diff:2,

{ id:'g2-8', track:'pe-geotech', topic:'pg-soil', diff:3,

{ id:'g2-9', track:'pe-geotech', topic:'pg-soil', diff:2,
  stem:'A soil has LL = 32 and PL = 18. Using the A-line PI = 0.73(LL\u221220), does it plot above or below?',

{ id:'g2-10', track:'pe-geotech', topic:'pg-soil', diff:3,
  stem:'A gradation has D\u2081\u2080 = 0.08 mm, D\u2083\u2080 = 0.30 mm, D\u2086\u2080 = 0.80 mm. What is the coefficient of uniformity C_u?',

{ id:'g2-11', track:'pe-geotech', topic:'pg-soil', diff:3,
  stem:'A CU triaxial test on sand gives \u03C3\u2083\u2032 = 2,000 psf and \u03C3\u2081\u2032 = 6,000 psf at failure. What is \u03D5\u2032?',

  solution:'\u03C3\u2081\u2032/\u03C3\u2083\u2032 = tan\u00B2(45 + \u03D5/2) = 6,000/2,000 = 3.0\ntan(45 + \u03D5/2) = 1.732 \u2192 45 + \u03D5/2 = 60\u00B0\n\u03D5/2 = 15\u00B0 \u2192 \u03D5\u2032 = 30.0\u00B0.',
  formula:'\u03C3\u2081\u2032/\u03C3\u2083\u2032 = tan\u00B2(45+\u03D5/2)' },
{ id:'g2-12', track:'pe-geotech', topic:'pg-soil', diff:2,
  stem:'Compacting soil wet of optimum moisture content generally produces:',
  choices:['A flocculated structure with higher permeability','A dispersed structure with lower permeability','Maximum dry density','Zero air voids'], answer:1,
  solution:'Wet of optimum, clay particles orient parallel (dispersed structure), which lowers permeability and reduces swell potential but also lowers strength and stiffness compared with dry-of-optimum compaction.' },
{ id:'g2-13', track:'pe-geotech', topic:'pg-soil', diff:3,
  stem:'A clay has an overconsolidation ratio of 4. Its preconsolidation pressure relative to current effective stress is:',
  choices:['One quarter','Equal','Twice','Four times'], answer:3,
  solution:'OCR = \u03C3\u2032_p/\u03C3\u2032_v = 4, so the preconsolidation pressure is four times the current vertical effective stress. Loading below \u03C3\u2032_p follows the stiffer recompression curve (C_r).',
  formula:'OCR = \u03C3\u2032_p/\u03C3\u2032_v' },

/* ---------- Groundwater & Seepage ---------- */
{ id:'g2-14', track:'pe-geotech', topic:'pg-water', diff:3,
  stem:'A falling-head test: a = 0.5 cm\u00B2, L = 12 cm, A = 20 cm\u00B2, head falls 60 cm to 30 cm in 120 s. What is k?',

{ id:'g2-15', track:'pe-geotech', topic:'pg-water', diff:3,

  solution:'FS = i_cr/i_exit = 1.05/0.55 = 1.91.\nTypical minimum FS against piping is 2.0 to 3.0, so this is marginal.',

{ id:'g2-16', track:'pe-geotech', topic:'pg-water', diff:2,
  stem:'A layered deposit has flow parallel to the layers. The equivalent permeability is:',

  solution:'For flow parallel to layering, k_eq(horizontal) = \u03A3(k\u1D62H\u1D62)/\u03A3H\u1D62, a weighted arithmetic mean dominated by the most permeable layer. Perpendicular flow uses a harmonic mean dominated by the least permeable layer.',
  formula:'k_h = \u03A3k\u1D62H\u1D62/\u03A3H\u1D62' },
{ id:'g2-17', track:'pe-geotech', topic:'pg-water', diff:3,
  stem:'A 30-ft deep excavation must be dewatered 5 ft below subgrade. The water table is 10 ft below grade. What total drawdown is required?',

  solution:'Target water level = 30 + 5 = 35 ft below grade\nExisting water table = 10 ft below grade\nDrawdown = 35 \u2212 10 = 25 ft.',
  formula:'drawdown = target depth \u2212 existing WT depth' },
{ id:'g2-18', track:'pe-geotech', topic:'pg-water', diff:2,
  stem:'A filter placed between fine soil and a coarse drain must satisfy criteria that prevent:',
  choices:['Freezing','Migration of fines into the drain while remaining permeable','Chemical attack','Settlement'], answer:1,
  solution:'Filter criteria (Terzaghi) require D\u2081\u2085(filter) < 5D\u2085(soil) for retention and D\u2081\u2085(filter) > 4D\u2081\u2085(soil) for permeability, so fines are retained while water passes freely.' },

{ id:'g2-19', track:'pe-geotech', topic:'pg-shallow', diff:3,
  stem:'A continuous footing 4 ft wide bears at 3 ft depth in sand, \u03B3 = 118 pcf, N_q = 18.4, N_\u03B3 = 22.4, c = 0. What is q_ult?',

{ id:'g2-20', track:'pe-geotech', topic:'pg-shallow', diff:2,

{ id:'g2-21', track:'pe-geotech', topic:'pg-shallow', diff:3,
  stem:'A 6-ft square footing carries P = 90 kip with M = 45 kip-ft. Is the resultant within the kern?',

{ id:'g2-22', track:'pe-geotech', topic:'pg-shallow', diff:3,
  stem:'For the footing above (B = 6 ft, P = 90 kip, e = 0.5 ft), what is the maximum edge pressure?',

{ id:'g2-23', track:'pe-geotech', topic:'pg-shallow', diff:2,
  stem:'A footing is placed below the frost depth primarily to prevent:',
  choices:['Bearing failure','Frost heave and thaw settlement','Sliding','Corrosion'], answer:1,
  solution:'Ice lens formation in frost-susceptible soils heaves footings upward, and thawing leaves a weakened, saturated soil. Founding below the local frost depth avoids both cycles.' },
{ id:'g2-24', track:'pe-geotech', topic:'pg-shallow', diff:3,
  stem:'A mat foundation is often chosen over spread footings when:',
  choices:['Soil is very strong','Individual footings would cover more than about half the building footprint','The building is single story','Groundwater is deep'], answer:1,
  solution:'When required spread footings become so large they approach roughly 50% or more of the footprint, a mat is usually more economical and it bridges soft spots, reducing differential settlement.' },

/* ---------- Deep Foundations ---------- */
{ id:'g2-25', track:'pe-geotech', topic:'pg-deep', diff:3,
  stem:'A 14-in square pile is driven 50 ft into clay with c_u = 1,200 psf and \u03B1 = 0.45. What is the skin friction capacity?',

  solution:'Perimeter = 4(14/12) = 4.667 ft\nA\u209B = 4.667(50) = 233.3 ft\u00B2\nf\u209B = 0.45(1,200) = 540 psf\nQ\u209B = 540(233.3) = 126,000 lb = 126 kip.',
  formula:'Q\u209B = \u03B1c_uA\u209B' },
{ id:'g2-26', track:'pe-geotech', topic:'pg-deep', diff:3,
  stem:'A 12-in diameter pile bears on rock with an allowable end bearing of 80 ksf. What is the end bearing capacity?',

  solution:'A_p = \u03C0(1.0)\u00B2/4 = 0.7854 ft\u00B2\nQ_p = 80(0.7854) = 62.8 kip.',
  formula:'Q_p = q_pA_p' },
{ id:'g2-27', track:'pe-geotech', topic:'pg-deep', diff:2,
  stem:'A pile group in clay may fail as a block. Block capacity is computed using:',
  choices:['The sum of individual pile capacities','The perimeter and base area of the whole group','Only the corner piles','The single pile capacity'], answer:1,
  solution:'Block failure treats the group plus enclosed soil as one large pier: skin friction on the group perimeter plus end bearing on the full group base area. Design capacity is the lesser of block and sum-of-individual capacities.' },
{ id:'g2-28', track:'pe-geotech', topic:'pg-deep', diff:3,
  stem:'Pile spacing in a group is typically a minimum of:',
  choices:['1.5 pile diameters','2.5 to 3 pile diameters','6 pile diameters','10 pile diameters'], answer:1,
  solution:'Typical minimum center-to-center spacing is 2.5 to 3 diameters. Closer spacing causes excessive stress overlap and installation interference; wider spacing enlarges the cap unnecessarily.' },
{ id:'g2-29', track:'pe-geotech', topic:'pg-deep', diff:3,
  stem:'A drilled shaft is constructed below the water table in caving sand. The appropriate method is:',
  choices:['Dry method','Casing or slurry (wet) method','Auger without support','Driven method'], answer:1,
  solution:'Below the water table in caving soils the hole cannot stand open, so temporary casing or drilling slurry (bentonite/polymer) is required to maintain hole stability until concrete is placed by tremie.' },
{ id:'g2-30', track:'pe-geotech', topic:'pg-deep', diff:3,
  stem:'A pile has Q_p = 90 kip and Q\u209B = 150 kip. Using FS = 2.5 on the total, what is the allowable capacity?',
  choices:['60 kip','96 kip','120 kip','150 kip'], answer:1,
  solution:'Q_ult = 90 + 150 = 240 kip\nQ_all = 240/2.5 = 96 kip.',
  formula:'Q_all = (Q_p + Q\u209B)/FS' },
{ id:'g2-31', track:'pe-geotech', topic:'pg-deep', diff:2,
  stem:'A static load test on a pile is considered the most reliable method because it:',
  choices:['Is fastest','Directly measures load-settlement behavior of the actual pile in situ','Requires no equipment','Predicts driving stresses'], answer:1,
  solution:'A static load test applies measured load increments and records settlement on the real pile in the real soil, capturing all installation effects that empirical formulas and dynamic methods only estimate.' },

/* ---------- Earth Retaining Structures ---------- */
{ id:'g2-32', track:'pe-geotech', topic:'pg-retain', diff:3,
  stem:'A 16-ft wall retains sand (\u03B3 = 122 pcf, \u03D5 = 34\u00B0). What is the active thrust per foot?',

  formula:'P_a = \u00BDK_a\u03B3H\u00B2' },
{ id:'g2-33', track:'pe-geotech', topic:'pg-retain', diff:2,
  stem:'The active thrust on a wall with a triangular pressure distribution acts at what height above the base?',
  choices:['H/4','H/3','H/2','2H/3'], answer:1,
  solution:'For a triangular distribution the resultant acts at the centroid, which is H/3 above the base. A uniform surcharge pressure instead acts at H/2.' },
{ id:'g2-34', track:'pe-geotech', topic:'pg-retain', diff:3,
  stem:'A braced excavation in soft clay uses an apparent pressure of 0.3\u03B3H for the rectangular diagram. With \u03B3 = 115 pcf and H = 25 ft, what is p?',

  solution:'p = 0.3\u03B3H = 0.3(115)(25) = 863 psf.',
  formula:'p = 0.3\u03B3H (soft clay, braced cut)' },
{ id:'g2-35', track:'pe-geotech', topic:'pg-retain', diff:3,
  stem:'A cantilever sheet pile wall derives its stability from:',
  choices:['Anchors near the top','Passive resistance of the embedded portion below dredge line','Wall self-weight','Base friction only'], answer:1,
  solution:'A cantilever sheet pile is fixed by soil: active pressure above the dredge line is resisted by passive pressure mobilized on the embedded length, which rotates about a point near the toe.' },
{ id:'g2-36', track:'pe-geotech', topic:'pg-retain', diff:3,
  stem:'An MSE wall 20 ft tall requires reinforcement length of at least 0.7H. What is that length?',
  choices:['10 ft','14 ft','16 ft','20 ft'], answer:1,
  solution:'L = 0.7H = 0.7(20) = 14 ft (and not less than 8 ft).',
  formula:'L \u2265 0.7H' },
{ id:'g2-37', track:'pe-geotech', topic:'pg-retain', diff:2,
  stem:'Wall drainage behind a retaining structure is provided primarily to:',
  choices:['Increase wall weight','Prevent buildup of hydrostatic pressure','Improve appearance','Reduce excavation'], answer:1,
  solution:'Without drainage, water behind the wall adds full hydrostatic pressure (62.4 pcf), which can easily exceed the soil pressure itself. Weep holes, drainage blanket, and a collector pipe relieve it.' },
{ id:'g2-38', track:'pe-geotech', topic:'pg-retain', diff:3,
  stem:'A gravity wall must resist overturning. Which action increases the factor of safety most directly?',
  choices:['Reducing base width','Increasing base width and wall weight','Removing the drainage','Steepening the backfill'], answer:1,
  solution:'FS_OT = \u03A3M_resist/\u03A3M_overturn. Widening the base increases both the stabilizing weight and its moment arm about the toe, so the resisting moment grows fastest.' },

/* ---------- Slope Stability ---------- */
{ id:'g2-39', track:'pe-geotech', topic:'pg-slope', diff:3,
  stem:'A dry cohesionless slope has \u03D5 = 36\u00B0. What is the steepest stable slope angle for FS = 1.3?',
  choices:['22.2\u00B0','27.9\u00B0','29.2\u00B0','36.0\u00B0'], answer:2,
  solution:'FS = tan\u03D5/tan\u03B2 \u2192 tan\u03B2 = tan\u03D5/FS\n= tan36\u00B0/1.3 = 0.7265/1.3 = 0.5589\n\u03B2 = 29.2\u00B0.',
  formula:'tan\u03B2 = tan\u03D5/FS' },
{ id:'g2-40', track:'pe-geotech', topic:'pg-slope', diff:2,
  stem:'A rapid drawdown condition on an earth dam is critical because:',
  choices:['The upstream water no longer provides stabilizing weight while pore pressures remain high','The soil dries out','Seepage stops entirely','The crest settles'], answer:0,
  solution:'When the reservoir drops quickly, the stabilizing external water load is removed but pore pressures inside the low-permeability embankment have not yet dissipated, sharply reducing effective stress and upstream slope stability.' },
{ id:'g2-41', track:'pe-geotech', topic:'pg-slope', diff:3,
  stem:'A slope has a driving moment of 4,800 kip-ft and resisting moment of 7,200 kip-ft. What is the FS?',
  choices:['0.67','1.20','1.50','2.00'], answer:2,
  solution:'FS = M_resist/M_drive = 7,200/4,800 = 1.50.\nThis meets the typical long-term minimum of 1.5.',
  formula:'FS = \u03A3M_r/\u03A3M_d' },
{ id:'g2-42', track:'pe-geotech', topic:'pg-slope', diff:3,
  stem:'A soil nail wall stabilizes a slope by:',
  choices:['Adding weight at the toe','Installing passive tensile reinforcement into the retained mass','Removing the slope','Freezing the ground'], answer:1,
  solution:'Soil nails are grouted, passive (untensioned) bars installed top-down. They pick up tension as the mass tends to deform, creating an internally reinforced gravity block.' },
{ id:'g2-43', track:'pe-geotech', topic:'pg-slope', diff:2,
  stem:'A toe berm improves slope stability primarily by:',
  choices:['Increasing the driving moment','Adding resisting weight at the toe, increasing the resisting moment','Reducing soil strength','Steepening the slope'], answer:1,
  solution:'A berm placed at the toe adds mass outboard of the failure circle center, which increases the resisting moment while barely affecting the driving moment, raising FS efficiently.' },
{ id:'g2-44', track:'pe-geotech', topic:'pg-slope', diff:3,
  stem:'An embankment on soft clay is built in stages primarily to:',
  choices:['Reduce cost','Allow consolidation and strength gain between lifts','Improve compaction','Speed construction'], answer:1,
  solution:'Staged construction limits each load increment so the foundation clay can consolidate and gain undrained shear strength before the next lift, avoiding a bearing or rotational failure during construction.' },

/* ---------- Ground Improvement ---------- */
{ id:'g2-45', track:'pe-geotech', topic:'pg-improve', diff:3,
  stem:'Dynamic compaction drops a heavy weight to densify soil. It is most effective in:',
  choices:['Saturated fat clay','Loose granular fills and rubble','Bedrock','Peat'], answer:1,
  solution:'Dynamic compaction densifies loose granular soils and heterogeneous fills where impact energy rearranges particles. Saturated clays cannot drain fast enough for the method to work.' },
{ id:'g2-46', track:'pe-geotech', topic:'pg-improve', diff:3,
  stem:'Stone columns improve soft ground primarily by:',
  choices:['Chemically hardening the soil','Providing stiff, free-draining inclusions that share load and speed consolidation','Freezing the soil','Removing all fines'], answer:1,
  solution:'Stone columns carry a disproportionate share of load due to their stiffness, reduce settlement, and act as vertical drains that accelerate consolidation of the surrounding soft soil.' },
{ id:'g2-47', track:'pe-geotech', topic:'pg-improve', diff:3,
  stem:'A surcharge preload of 1,000 psf is placed to precompress a clay. After removal, the clay behaves as:',
  choices:['Normally consolidated','Overconsolidated, with much smaller settlement under later loads','Liquefied','Unchanged'], answer:1,
  solution:'Preloading pushes the clay past its previous \u03C3\u2032_p. When the surcharge is removed, the soil is overconsolidated relative to the permanent structure load, so subsequent settlement follows the flat recompression curve.' },
{ id:'g2-48', track:'pe-geotech', topic:'pg-improve', diff:2,
  stem:'A subgrade has an R-value of 20. R-value is used primarily in:',
  choices:['Concrete mix design','Pavement thickness design (resistance to lateral deformation)','Slope stability','Pile design'], answer:1,
  solution:'The Hveem stabilometer R-value measures a soil\u2019s resistance to lateral plastic deformation under vertical load and is used in flexible pavement thickness design, particularly in western U.S. practice.' },
{ id:'g2-49', track:'pe-geotech', topic:'pg-improve', diff:3,
  stem:'Liquefaction potential is highest in:',
  choices:['Dense gravel','Loose, saturated, uniformly graded fine sand','Stiff clay','Dry sand'], answer:1,
  solution:'Liquefaction requires saturation, contractive (loose) structure, and low permeability enough to prevent rapid drainage. Loose, saturated, poorly graded fine sands and non-plastic silts are the classic susceptible soils.' },
{ id:'g2-50', track:'pe-geotech', topic:'pg-improve', diff:3,
  stem:'A geogrid used in a reinforced soil slope works primarily in:',
  choices:['Compression','Tension','Shear only','Torsion'], answer:1,
  solution:'Geogrids carry tensile load. Soil is strong in compression but weak in tension, so tensile inclusions supply the missing strength, and load transfers through interlock and friction at the grid apertures.' }
];

{ id:'t2-23', track:'pe-transpo', topic:'pt-drain', diff:2,

{ id:'w2-46', track:'pe-wre', topic:'pw-quality', diff:2,

{ id:'w2-49', track:'pe-wre', topic:'pw-drinking', diff:3,

{ id:'w2-51', track:'pe-wre', topic:'pw-drinking', diff:2,
  stem:'The primary purpose of coagulation in water treatment is to:',

{ id:'w2-52', track:'pe-wre', topic:'pw-drinking', diff:3,

{ id:'w2-53', track:'pe-wre', topic:'pw-drinking', diff:3,

  solution:'Most state standards require at least 20 psi residual at all points during fire flow to prevent backsiphonage and contamination intrusion. Normal operating pressures run 40\u201380 psi.' },
{ id:'w2-54', track:'pe-wre', topic:'pw-drinking', diff:3,

{ id:'c2-11', track:'pe-construction', topic:'pc-ops', diff:3,

{ id:'c2-12', track:'pe-construction', topic:'pc-ops', diff:3,

{ id:'c2-13', track:'pe-construction', topic:'pc-ops', diff:3,

{ id:'c2-15', track:'pe-construction', topic:'pc-ops', diff:3,

{ id:'c2-16', track:'pe-construction', topic:'pc-ops', diff:3,

{ id:'c2-17', track:'pe-construction', topic:'pc-sched', diff:3,

{ id:'c2-19', track:'pe-construction', topic:'pc-sched', diff:3,

{ id:'c2-20', track:'pe-construction', topic:'pc-sched', diff:2,

{ id:'c2-21', track:'pe-construction', topic:'pc-sched', diff:3,

{ id:'c2-22', track:'pe-construction', topic:'pc-sched', diff:3,

{ id:'c2-23', track:'pe-construction', topic:'pc-qc', diff:3,

{ id:'c2-25', track:'pe-construction', topic:'pc-qc', diff:2,

{ id:'c2-26', track:'pe-construction', topic:'pc-qc', diff:3,
  stem:'An asphalt mat is specified at 92% of theoretical maximum density (Gmm). A core gives 91.2%. This is:',

{ id:'c2-31', track:'pe-construction', topic:'pc-temp', diff:2,

/* ---------- helpers ---------- */
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var shuffle=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));
  var t=a[i];a[i]=a[j];a[j]=t}return a};
var pct=function(a,b){return b?Math.round(a/b*100):0};
var fmt=function(s){var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  var p=function(n){return n<10?'0'+n:''+n};
  return h>0?h+':'+p(m)+':'+p(x):m+':'+p(x)};
var LETTER=['A','B','C','D'];

var BANK=[].concat(BANK_FE,BANK_PE,BANK_X,BANK_F,BANK_PS2,BANK_PG2,BANK_PT2,BANK_PW2,BANK_PC2,BANK_FE2);
var track=TRACKS[0], tab='guide';
var bankFor=function(id){return BANK.filter(function(q){return q.track===id})};
var cardsFor=function(id){return CARDS.filter(function(c){return c.track===id})};
var topicName=function(tid){
  for(var i=0;i<TRACKS.length;i++){var x=TRACKS[i].topics.filter(function(o){return o.id===tid})[0];
    if(x)return x.name}
  return tid};

/* Session-scoped freshness ledger: avoids repeating questions across
   consecutive attempts within the same visit (nothing is persisted). */
var SEEN={};
function markSeen(list){var t=Date.now();list.forEach(function(q){SEEN[q.id]=t})}
function pickFresh(pool,n){
  var fresh=[],recent=[];
  pool.forEach(function(q){(SEEN[q.id]?recent:fresh).push(q)});
  var out=shuffle(fresh).slice(0,n);
  if(out.length<n){
    recent.sort(function(a,b){return SEEN[a.id]-SEEN[b.id]});
    out=out.concat(recent.slice(0,n-out.length));
  }
  return out;
}

/* Shuffle choices per session so answers aren't memorizable by position. */
function prep(list){
  return list.map(function(q){
    var order=shuffle(q.choices.map(function(_,i){return i}));
    return {id:q.id,topic:q.topic,stem:q.stem,solution:q.solution,formula:q.formula,diff:q.diff,
      choices:order.map(function(i){return q.choices[i]}),answer:order.indexOf(q.answer)};
  });
}

/* ---------- shell ---------- */
var TABS=[['guide','Study Guide'],['cards','Flashcards'],['quiz','Practice'],['formulas','Formulas'],['legal','Legal & Terms']];
function shell(){
  $('#sel').innerHTML=TRACKS.map(function(t){
    return '<option value="'+t.id+'"'+(t.id===track.id?' selected':'')+'>'+esc(t.name)+'</option>'}).join('');
  $('#tabs').innerHTML=TABS.map(function(t){
    return '<button class="tab'+(tab===t[0]?' on':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>'}).join('');
  document.documentElement.style.setProperty('--accent',track.accent);
  document.documentElement.style.setProperty('--accent2',track.accent2);
}
function setTrack(id){
  track=TRACKS.filter(function(t){return t.id===id})[0];
  deck=null;sess=null;render();
}
function setTab(t){tab=t;deck=null;sess=null;render();}
function render(){
  shell();
  var v={guide:vGuide,cards:vCards,quiz:vQuiz,formulas:vFormulas,legal:vLegal}[tab];
  $('#main').innerHTML='<div class="view">'+v()+'</div>';
  window.scrollTo({top:0,behavior:'smooth'});
}

      '<div class="muted">Question counts are the published exam weights. Expand any area to drill it.</div></div></div>'+
    t.topics.map(function(tp,i){
      var qs=bankFor(t.id).filter(function(q){return q.topic===tp.id}).length;

            (cs?'<button class="btn sm" onclick="startDeck(\''+tp.id+'\')">'+cs+' flashcards</button>':'')+
          '</div>'+
        '</div></div>';
    }).join('')+

/* ---------- flashcards ---------- */
var deck=null;
function startDeck(topic){
  var pool=cardsFor(track.id);
  if(topic&&topic!=='all')pool=pool.filter(function(c){return c.topic===topic});
  deck={cards:shuffle(pool),i:0,flip:false,known:0,miss:0,topic:topic||'all',done:false,history:{}};
  tab='cards';render();
}
function vCards(){
  if(!deck)startDeckSilent('all');
  var topics=[];cardsFor(track.id).forEach(function(c){if(topics.indexOf(c.topic)<0)topics.push(c.topic)});
  var picker='<div class="tabs"><button class="tab'+(deck.topic==='all'?' on':'')+'" onclick="startDeck(\'all\')">All cards</button>'+
    topics.map(function(t){return '<button class="tab'+(deck.topic===t?' on':'')+'" onclick="startDeck(\''+t+'\')">'+esc(topicName(t))+'</button>'}).join('')+'</div>';
  if(!deck.cards.length)return picker+'<div class="empty"><h3>No cards for this area yet</h3>'+
    '<p class="muted">Try another topic, or drill practice questions instead.</p>'+
    '<div style="margin-top:14px"><button class="btn p" onclick="startDeck(\'all\')">Show all cards</button></div></div>';
  if(deck.done){
    var tot=deck.known+deck.miss;
    return picker+'<div class="res"><div class="score">'+pct(deck.known,tot)+'%</div>'+
      '<h3 style="margin-top:8px">Deck complete</h3>'+
      '<p class="muted">'+deck.known+' known \u00b7 '+deck.miss+' to review \u00b7 '+tot+' cards</p>'+
      '<div class="row" style="justify-content:center;margin-top:18px">'+
        '<button class="btn p" onclick="startDeck(\''+deck.topic+'\')">Study again</button>'+
        '<button class="btn" onclick="setTab(\'quiz\')">Test yourself</button></div></div>';
  }
  var c=deck.cards[deck.i];
  return picker+'<div class="fcwrap">'+
    '<div style="width:100%;max-width:620px">'+
      '<div class="between" style="margin-bottom:6px"><span class="muted">Card '+(deck.i+1)+' of '+deck.cards.length+'</span>'+
      '<span class="row"><span class="chip g">'+deck.known+' known</span><span class="chip w">'+deck.miss+' review</span></span></div>'+
      '<div class="bar"><i style="width:'+pct(deck.i,deck.cards.length)+'%"></i></div></div>'+
    '<div class="fc'+(deck.flip?' flip':'')+'" id="fc" onclick="flip()"><div class="fci">'+
      '<div class="fcf"><div class="fct">'+esc(topicName(c.topic))+'</div>'+
        '<div class="fcx">'+esc(c.front)+'</div><div class="hint">Click or press Space to reveal</div></div>'+
      '<div class="fcf fcb"><div class="fct">Answer</div>'+
        '<div class="fcx">'+esc(c.back)+'</div><div class="hint">1 = still learning \u00b7 2 = got it</div></div>'+
    '</div></div>'+
    '<div class="row" style="justify-content:center;gap:10px">'+
      '<button class="btn" onclick="prevCard()" '+(deck.i===0?'disabled style="opacity:0.35;pointer-events:none;"':'')+'>Back</button>'+
      '<button class="btn d" onclick="grade(0)">Still learning</button>'+
      '<button class="btn p" onclick="grade(1)">Got it</button>'+
      '<button class="btn" onclick="nextCard()" '+(deck.history[deck.i]!==undefined?'':'disabled style="opacity:0.35;pointer-events:none;"')+'>Next</button></div></div>';
}
function startDeckSilent(t){var pool=cardsFor(track.id);
  deck={cards:shuffle(pool),i:0,flip:false,known:0,miss:0,topic:t,done:false,history:{}}}
function flip(){deck.flip=!deck.flip;var e=$('#fc');if(e)e.classList.toggle('flip',deck.flip)}
function prevCard(){if(deck.i>0){deck.i--;deck.flip=false;render()}}
function nextCard(){
  if(deck.i<deck.cards.length-1){
    deck.i++;
    deck.flip=false;
    render();
  } else {
    deck.done=true;
    render();
  }
}
function grade(k){
  deck.history[deck.i] = (k===1);
  deck.known = Object.keys(deck.history).filter(function(x){return deck.history[x]===true}).length;
  deck.miss = Object.keys(deck.history).filter(function(x){return deck.history[x]===false}).length;
  if(deck.i>=deck.cards.length-1)deck.done=true;else{deck.i++;deck.flip=false}
  render();
}

/* ---------- quiz + mock ---------- */
var sess=null,tid=null;
function vQuiz(){
  if(sess)return sess.done?vResult():vRun();
  var t=track,pool=bankFor(t.id),n=pool.length;
  var avail=t.topics.filter(function(tp){return pool.some(function(q){return q.topic===tp.id})});
  return '<div class="intro"><h1>Practice '+esc(t.short)+'</h1>'+
    '<p>Every question has a full worked solution. Mock exams are drawn weighted to the published topic '+
    'distribution and timed at real exam pace ('+(Math.round(t.minutes/t.questions*10)/10)+' min/question).</p></div>'+
    '<div class="grid g3" style="margin-bottom:22px">'+
      card('Quick 10','Ten mixed questions with instant feedback and worked solutions.','start([],10,0)','Start quiz')+
      card('Half mock',Math.min(40,n)+' questions, timed, no feedback until you submit.','start([],'+Math.min(40,n)+',1)','Start half mock')+
      card('Full mock',Math.min(t.questions,n)+' questions weighted to the spec, timed at exam pace.','start([],'+Math.min(t.questions,n)+',1)','Start full mock')+
    '</div>'+
    '<h2 style="margin-bottom:4px">Drill one area</h2>'+
    '<div class="muted" style="margin-bottom:12px">Practice mode with a solution after every question.</div>'+
    '<div class="grid g2">'+avail.map(function(tp){
      var c=pool.filter(function(q){return q.topic===tp.id}).length;
      return '<button class="card" style="text-align:left;cursor:pointer" onclick="start([\''+tp.id+'\'],'+Math.min(c,10)+',0)">'+
        '<div class="between"><b style="font-size:14px">'+esc(tp.name)+'</b><span class="chip">'+c+' Qs</span></div>'+
        '<div class="muted" style="margin-top:4px">'+tp.min+'\u2013'+tp.max+' on the real exam</div></button>';
    }).join('')+'</div>';
}
function card(title,body,fn,cta){
  return '<div class="card"><h3>'+title+'</h3><p class="muted" style="margin:6px 0 13px">'+body+'</p>'+
    '<button class="btn p" onclick="'+fn+'">'+cta+'</button></div>';
}
function start(topics,count,timed){
  var pool=bankFor(track.id);
  if(topics&&topics.length)pool=pool.filter(function(q){return topics.indexOf(q.topic)>=0});
  if(!pool.length)return;
  var qs;
  if(!topics.length&&count>=20){
    /* weighted sample across the spec, like the real exam */
    var picked=[],used={},tot=0;
    var w=track.topics.map(function(tp){var x=(tp.min+tp.max)/2;tot+=x;return{id:tp.id,w:x}});
    w.forEach(function(x){
      var want=Math.round(x.w/tot*count);
      pickFresh(pool.filter(function(q){return q.topic===x.id&&!used[q.id]}),want)
        .forEach(function(q){picked.push(q);used[q.id]=1});
    });
    var rest=pickFresh(pool.filter(function(q){return !used[q.id]}),count).reverse();
    while(picked.length<count&&rest.length){var q=rest.pop();picked.push(q);used[q.id]=1}
    qs=prep(shuffle(picked).slice(0,count));
  } else qs=prep(pickFresh(pool,Math.min(count,pool.length)));
  markSeen(qs);
  sess={qs:qs,i:0,ans:qs.map(function(){return null}),shown:{},instant:!timed,timed:!!timed,
    left:timed?Math.round(track.minutes/track.questions*qs.length)*60:0,t0:Date.now(),done:false};
  tab='quiz';
  if(timed)tick();
  render();
}
function tick(){
  clearInterval(tid);
  tid=setInterval(function(){
    if(!sess||sess.done){clearInterval(tid);return}
    sess.left--;
    var e=$('#tm');
    if(e){e.textContent=fmt(Math.max(0,sess.left));if(sess.left<300)e.className='timer low'}
    if(sess.left<=0){clearInterval(tid);finish()}
  },1000);
}
function vRun(){
  var q=sess.qs[sess.i],p=sess.ans[sess.i],show=sess.instant&&sess.shown[sess.i];
  var done=sess.ans.filter(function(a){return a!==null}).length;
  return '<div class="qhead"><div style="flex:1;min-width:180px">'+
      '<div class="muted">Question '+(sess.i+1)+' of '+sess.qs.length+'</div>'+
      '<div class="bar" style="margin-top:6px;max-width:220px"><i style="width:'+pct(done,sess.qs.length)+'%"></i></div></div>'+
      (sess.timed?'<span class="timer'+(sess.left<300?' low':'')+'" id="tm">'+fmt(Math.max(0,sess.left))+'</span>':'')+
      '<button class="btn sm d" onclick="quit()">Exit</button></div>'+
    '<div class="pal">'+sess.qs.map(function(_,i){
      return '<button class="'+(i===sess.i?'cur ':'')+(sess.ans[i]!==null?'a':'')+'" onclick="jump('+i+')">'+(i+1)+'</button>'}).join('')+'</div>'+
    '<div class="card"><div class="qtopic">'+esc(topicName(q.topic))+'</div>'+
      '<div class="stem">'+esc(q.stem)+'</div>'+
      q.choices.map(function(c,i){
        var cls='';
        if(show){cls=(i===q.answer?'ok':(i===p?'no':''))+' lock'}
        else if(p===i)cls='sel';
        return '<button class="ch '+cls+'" onclick="pick('+i+')"><span class="ck">'+LETTER[i]+'</span><span>'+esc(c)+'</span></button>';
      }).join('')+
      (show?'<div class="exp"><b style="color:'+(p===q.answer?'var(--good)':'var(--bad)')+'">'+
        (p===q.answer?'Correct':'Not quite \u2014 the answer is '+LETTER[q.answer])+'</b>'+
        '<pre>'+esc(q.solution)+'</pre>'+(q.formula?'<div class="eqn">'+esc(q.formula)+'</div>':'')+'</div>':'')+
    '</div>'+
    '<div class="between" style="margin-top:14px">'+
      '<button class="btn" onclick="nav(-1)"'+(sess.i===0?' disabled':'')+'>Previous</button>'+
      '<span class="muted">'+done+' of '+sess.qs.length+' answered</span>'+
      (sess.i===sess.qs.length-1?'<button class="btn p" onclick="finish()">Submit</button>':
        '<button class="btn p" onclick="nav(1)">Next</button>')+
    '</div>';
}
function pick(i){
  if(sess.instant&&sess.shown[sess.i])return;
  sess.ans[sess.i]=i;
  if(sess.instant)sess.shown[sess.i]=1;
  render();
}
function nav(d){sess.i=Math.max(0,Math.min(sess.qs.length-1,sess.i+d));render()}
function jump(i){sess.i=i;render()}
function quit(){if(confirm('Exit this session? Your progress on this attempt is discarded.')){clearInterval(tid);sess=null;render()}}
function finish(){
  clearInterval(tid);
  var c=0;sess.qs.forEach(function(q,i){if(sess.ans[i]===q.answer)c++});
  sess.correct=c;sess.score=pct(c,sess.qs.length);
  sess.secs=Math.round((Date.now()-sess.t0)/1000);sess.done=true;
  render();
}
function vResult(){
  var s=sess,pass=s.score>=70;
  var by={};
  s.qs.forEach(function(q,i){
    by[q.topic]=by[q.topic]||{n:0,ok:0};by[q.topic].n++;
    if(s.ans[i]===q.answer)by[q.topic].ok++;
  });
  return '<div class="res"><div class="score" style="color:'+(pass?'var(--good)':'var(--text)')+'">'+s.score+'%</div>'+
    '<h3 style="margin-top:8px">'+(pass?'Above the 70% study benchmark':'Below the 70% study benchmark')+'</h3>'+
    '<p class="muted">'+s.correct+' of '+s.qs.length+' correct \u00b7 '+fmt(s.secs)+' elapsed</p>'+
    '<div class="row" style="justify-content:center;margin-top:18px">'+
      '<button class="btn p" onclick="sess=null;render()">Practice again</button>'+
      '<button class="btn" onclick="setTab(\'guide\')">Back to guide</button></div></div>'+
    '<div class="card" style="margin-bottom:18px"><h2 style="margin-bottom:10px">By topic</h2>'+
      Object.keys(by).map(function(k){
        var v=by[k],p=pct(v.ok,v.n);
        var col=p>=75?'var(--good)':p>=50?'var(--warn)':'var(--bad)';
        return '<div class="between" style="padding:8px 0;border-bottom:1px solid var(--line2)">'+
          '<span style="flex:1;min-width:0;font-size:13.5px">'+esc(topicName(k))+'</span>'+
          '<span style="color:'+col+';font-weight:650;font-size:13px">'+v.ok+'/'+v.n+'</span></div>';
      }).join('')+'</div>'+
    '<h2 style="margin-bottom:10px">Review all '+s.qs.length+' questions</h2>'+
    s.qs.map(function(q,i){
      var a=s.ans[i],ok=a===q.answer;
      return '<div class="rev"><div class="row" style="align-items:flex-start;gap:11px;margin-bottom:10px">'+
        '<span class="badge" style="background:'+(ok?'var(--good)':'var(--bad)')+'">'+(ok?'\u2713':'\u2717')+'</span>'+
        '<div style="flex:1;min-width:0"><div class="qtopic">Q'+(i+1)+' \u00b7 '+esc(topicName(q.topic))+'</div>'+
        '<div style="font-size:14.5px;line-height:1.6;white-space:pre-wrap">'+esc(q.stem)+'</div></div></div>'+
        '<div style="font-size:13px;margin-bottom:9px">'+
          '<div style="color:var(--good)"><b>Correct:</b> '+LETTER[q.answer]+'. '+esc(q.choices[q.answer])+'</div>'+
          (a===null?'<div class="muted"><b>You:</b> left blank</div>':
            (!ok?'<div style="color:var(--bad)"><b>You:</b> '+LETTER[a]+'. '+esc(q.choices[a])+'</div>':''))+
        '</div>'+
        '<div class="exp"><b>Worked solution</b><pre>'+esc(q.solution)+'</pre>'+
        (q.formula?'<div class="eqn">'+esc(q.formula)+'</div>':'')+'</div></div>';
    }).join('');
}

/* ---------- formulas ---------- */
var fq='';
function vFormulas(){
  var groups=FORMULAS.filter(function(g){return g.track===track.id});
  var q=fq.trim().toLowerCase();
  var out=groups.map(function(g){
    return {group:g.group,items:q?g.items.filter(function(i){
      return (i.n+' '+i.f).toLowerCase().indexOf(q)>=0}):g.items}
  }).filter(function(g){return g.items.length});
  var n=out.reduce(function(s,g){return s+g.items.length},0);
  return '<input class="search" id="fi" placeholder="Search formulas\u2026" value="'+esc(fq)+'" oninput="fsearch(this.value)">'+
    (n?out.map(function(g){
      return '<div class="fgrp"><b>'+esc(g.group)+'</b>'+g.items.map(function(i){
        return '<div class="fitem"><div class="n">'+esc(i.n)+'</div><div class="e">'+esc(i.f)+'</div></div>'
      }).join('')+'</div>';
    }).join(''):'<div class="empty"><h3>No formulas match "'+esc(fq)+'"</h3>'+
      '<p class="muted">Try a shorter term like "shear", "curve", or "flow".</p></div>')+
    '<div class="card" style="border-style:dashed"><div class="muted">'+
    '<b style="color:var(--text)">These are recall aids, not the official handbook.</b> '+
    'NCEES supplies a searchable reference on exam day \u2014 use this to build recognition speed.</div></div>';
}
function fsearch(v){
  fq=v;
  $('#main').innerHTML='<div class="view">'+vFormulas()+'</div>';
  var i=$('#fi');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}
}

/* ---------- keys ---------- */
document.addEventListener('keydown',function(e){
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName))return;
  if(tab==='cards'&&deck&&!deck.done&&deck.cards.length){
    if(e.code==='Space'){e.preventDefault();flip();return}
    if(e.key==='1'){grade(0);return}
    if(e.key==='2'){grade(1);return}
    if(e.key==='ArrowLeft'){prevCard();return}
    if(e.key==='ArrowRight'&&deck.history[deck.i]!==undefined){nextCard();return}
  }
  if(sess&&!sess.done){
    if(['1','2','3','4'].indexOf(e.key)>=0){pick(+e.key-1);return}
    var k=e.key.toLowerCase();
    if(['a','b','c','d'].indexOf(k)>=0){pick('abcd'.indexOf(k));return}
    if(e.key==='ArrowRight'){nav(1);return}
    if(e.key==='ArrowLeft'){nav(-1);return}
  }
});
